<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Tableau de bord Rétro-automatique</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Black+Ops+One&family=Caveat:wght@500;700&family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* Mise en page : la « salle de contrôle » du jeu. Bandeau photo des consoles, onglets-tampons, panneaux d'acier sombre,
   une couleur par mission (comme dans le jeu), documents papier façon rapport de laboratoire. Univers unique et sombre, choisi
   délibérément pour coller au jeu : pas de thème clair. */
:root{
  color-scheme:dark;
  --bg:#0b0d0c;            /* nuit */
  --surface:#161a18;       /* suie */
  --surface-2:#1f2421;
  --line:#2a302d;          /* acier */
  --grid:#222825;
  --fg:#eef0e6;            /* papier */
  --fg-2:#c9cfc6;
  --fg-3:#a9b0a6;
  --accent:#e3b02a; --accent-ink:#1b1405; --accent-soft:rgba(227,176,42,.14);   /* or du jeu */
  --m1:#b6c10e; --m1-on:#15170a; --m2:#1197bd; --m2-on:#ffffff; --m3:#cf3cbb; --m3-on:#ffffff; --m4:#c4520e; --m4-on:#ffffff; --m5:#8f6df0; --m5-on:#ffffff; --m6:#14a38b; --m6-on:#ffffff; --mx:#a9b0a6;
  --acc:var(--accent); --on:var(--accent-ink);
  --jeu:#b58613; --el:#3d86d6;                                  /* modalités : laiton / bleu, validées sur fond sombre */
  --e0:#3fae55; --e1:#7a5a2e; --e2:#c4762a; --e3:#ec5a3c;       /* 1er essai, puis 1, 2, 3+ erreurs */
  --good:#4cc764; --good-soft:rgba(47,158,68,.18); --warn:#e8742a; --warn-soft:rgba(232,116,42,.16); --bad:#ef6a5f; --bad-soft:rgba(217,68,58,.18); --none:#3a423e;
  --f-title:"Russo One","Chakra Petch",system-ui,sans-serif;
  --f-stamp:"Black Ops One","Chakra Petch",Impact,sans-serif;
  --f-display:"Chakra Petch","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --f-hand:"Caveat","Segoe Print","Comic Sans MS",cursive;
  --r:4px;
  --lab-1:#0b0d0c; --lab-2:#161a18; --lab-ink:#eef0e6; --lab-dim:#a9b0a6; --lab-line:rgba(255,255,255,.22); --amber:#e3b02a; --amber-ink:#1b1405;
}
body[data-m="1"]{--acc:var(--m1);--on:var(--m1-on)} body[data-m="2"]{--acc:var(--m2);--on:var(--m2-on)}
body[data-m="3"]{--acc:var(--m3);--on:var(--m3-on)} body[data-m="4"]{--acc:var(--m4);--on:var(--m4-on)}
body[data-m="5"]{--acc:var(--m5);--on:var(--m5-on)} body[data-m="6"]{--acc:var(--m6);--on:var(--m6-on)}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45;
  background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.012) 0 2px,transparent 2px 10px)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
h2{font-size:15px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg)}
h3{font-size:15px;font-weight:600}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--fg-3);font-weight:600;font-family:var(--f-display)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.view{display:flex;flex-direction:column;gap:18px}

/* bandeau : photo de la salle des consoles du jeu */
.top{position:relative;overflow:hidden;border-radius:var(--r);color:var(--lab-ink);padding:26px 24px 30px;display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end;justify-content:space-between;min-height:190px;
  background:var(--lab-1);box-shadow:0 10px 40px rgba(0,0,0,.5);--hero:url("a/hall.webp");--hero-pos:center 62%}
.top::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 50% 120% at 100% 0%,color-mix(in srgb,var(--acc) 26%,transparent),transparent 70%),linear-gradient(90deg,rgba(11,13,12,.94) 0%,rgba(11,13,12,.72) 45%,rgba(11,13,12,.3) 100%),var(--hero) var(--hero-pos)/cover no-repeat}
.top.swap::before{animation:heroIn .6s ease-out}
@keyframes heroIn{from{opacity:.15;transform:scale(1.03)}to{opacity:1;transform:none}}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:8px;background:repeating-linear-gradient(135deg,var(--acc) 0 12px,#111 12px 24px)}
.top .ttl{display:flex;flex-direction:column;gap:6px;min-width:0;position:relative;z-index:1}
.top .brand{display:flex;align-items:center;gap:12px}
.top .brand img{width:46px;height:46px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.2)}
.top .eyebrow{color:var(--amber);letter-spacing:.2em;font-family:var(--f-stamp);font-weight:400;font-size:12px}
.top h1{font-family:var(--f-title);font-weight:400;font-size:clamp(28px,4.2vw,42px);letter-spacing:.03em;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.top .src{display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--lab-dim);font-size:13px}
.top .btn{background:rgba(0,0,0,.55);border-color:var(--lab-line);color:var(--lab-ink)}
.top .btn:hover{border-color:var(--amber)}
.top .btn.primary{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;font-family:var(--f-display)}
.pill.demo{background:rgba(227,176,42,.2);color:#ffd977}
.pill.real{background:rgba(47,158,68,.25);color:#a9eac2}
.pill.clock{background:rgba(0,0,0,.55);color:#fff;border:1px solid var(--lab-line)}
.gauges{display:flex;gap:10px;position:relative;z-index:1;background:rgba(0,0,0,.5);border:1px solid var(--lab-line);border-radius:var(--r);padding:8px 10px}
.gauge{display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--f-display);font-size:11px;color:var(--lab-dim);letter-spacing:.06em}
.gauge svg{width:62px;height:62px}
@media (max-width:1000px){.gauges{display:none}}
.gauges{gap:6px}.gauge svg{width:52px;height:52px}
.actions{display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:.55em 1.3em;border-radius:999px;border:1px solid transparent;background:#3a3f3c;color:#fff;font-family:var(--f-display);font-weight:600;font-size:13px}
.btn:hover{filter:brightness(1.15)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:2px;text-align:left}

.tabs{display:inline-flex;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.tabs button{border:0;background:transparent;padding:5px 13px;border-radius:999px;font-family:var(--f-display);font-size:13px;font-weight:600;color:var(--fg-3)}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tabs button:disabled{opacity:.4;cursor:default}
/* navigation : onglets de type tampon, chaque mission dans sa couleur */
.nav{display:flex;flex-wrap:wrap;gap:6px}
.nav button{--c:var(--fg-3);border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:999px;font-family:var(--f-display);font-weight:600;font-size:13.5px;color:var(--fg-2);display:inline-flex;align-items:center;gap:7px}
.nav button:hover{border-color:var(--c)}
.nav button[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--cn,#1b1405)}
.nav button[data-v="global"],.nav button[data-v="mail"],.nav button[data-v="proj"],.nav button[data-v="format"]{--c:var(--accent);--cn:var(--accent-ink)}
.nav button[data-v="m1"]{--c:var(--m1);--cn:var(--m1-on)} .nav button[data-v="m2"]{--c:var(--m2);--cn:var(--m2-on)} .nav button[data-v="m3"]{--c:var(--m3);--cn:var(--m3-on)} .nav button[data-v="m4"]{--c:var(--m4);--cn:var(--m4-on)} .nav button[data-v="m5"]{--c:var(--m5);--cn:var(--m5-on)} .nav button[data-v="m6"]{--c:var(--m6);--cn:var(--m6-on)}
.nav button .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--c);color:var(--cn,#1b1405);font-family:var(--f-title);font-size:11px}
.nav button[aria-pressed="true"] .mk{background:rgba(0,0,0,.25);color:inherit}
.filters{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.flabel{font-size:11px;color:var(--fg-3);font-weight:600;margin-right:8px;text-transform:uppercase;letter-spacing:.1em;font-family:var(--f-display)}
.msg{font-size:13px;padding:9px 14px;border-radius:var(--r);display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px solid transparent}
.msg.err{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.msg.ok{background:var(--good-soft);color:var(--good);border-color:var(--good)}
.msg.ask{background:var(--accent-soft);color:var(--fg);border-color:var(--accent)}

/* indicateurs : afficheurs de console */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.kpi{background:linear-gradient(180deg,#1b201d,#121513);border:1px solid var(--line);border-top:3px solid var(--acc);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:3px;min-width:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.kpi .v{font-family:var(--f-title);font-size:28px;font-weight:400;font-variant-numeric:tabular-nums;line-height:1.15;color:#fff}
.kpi .v small{font-size:13px;color:var(--fg-3);font-family:var(--f-display);margin-left:3px}
.kpi .s{font-size:12px;color:var(--fg-3)}
.split{display:flex;height:6px;border-radius:3px;overflow:hidden;gap:2px;margin-top:4px}
.split i{display:block;height:100%}
/* en-tête de mission : la carte colorée du jeu */
.mhead{display:flex;gap:6px 18px;align-items:center;flex-wrap:wrap;background:var(--acc);color:var(--on);border-radius:var(--r);padding:16px 20px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.mhead .big{font-family:var(--f-stamp);font-size:22px;letter-spacing:.14em;text-transform:uppercase;color:inherit;opacity:.9}
.mhead h2{font-family:var(--f-title);font-weight:400;font-size:clamp(18px,2.4vw,24px);text-transform:none;letter-spacing:.01em;color:inherit}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px}
.ph h2::before{content:"";display:inline-block;width:8px;height:8px;background:var(--acc);margin-right:8px;vertical-align:1px;border-radius:1px}
.ph p{margin:0;font-size:12px;color:var(--fg-3)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--fg-2);align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg.chart text{fill:var(--fg-3);font-family:var(--f-mono);font-size:11px}
svg.chart .lbl{fill:var(--fg-2);font-family:var(--f-display);font-size:12.5px;font-weight:600}
svg.chart .qt{fill:var(--fg);font-family:var(--f-body);font-size:12.5px}
svg.chart .val{fill:var(--fg);font-family:var(--f-mono);font-size:11px}
svg.chart .gl{stroke:var(--grid);stroke-width:1}
svg.chart .ax{stroke:var(--line);stroke-width:1}
svg.chart .row:hover .hl{fill:var(--surface-2)}
.callout{font-size:13px;color:var(--fg-2);background:var(--surface-2);border-radius:var(--r);padding:8px 12px;margin:0}
.callout b{color:var(--fg)}
/* le post-it de l'ancien chef de labo */
.postit{align-self:flex-start;max-width:520px;background:#fff27a;color:#2b2a1a;padding:18px 22px 14px;transform:rotate(-1.2deg);box-shadow:0 12px 26px rgba(0,0,0,.5);font-family:var(--f-hand);font-size:23px;line-height:1.2;position:relative;margin:6px 0 4px 8px}
.postit::before{content:"";position:absolute;top:-11px;left:50%;width:84px;height:24px;transform:translateX(-50%) rotate(2deg);background:rgba(255,255,255,.5);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.postit p{margin:0}
.postit .sig{display:block;text-align:right;font-size:19px;margin-top:4px;opacity:.75}
.tip{position:fixed;pointer-events:none;background:#eef0e6;color:#161a18;padding:6px 10px;border-radius:var(--r);font-size:12px;line-height:1.4;z-index:90;max-width:320px;box-shadow:0 6px 18px rgba(0,0,0,.5)}
.xscroll{overflow-x:auto}
.qdetail{border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.qdetail .enonce{font-size:14px;max-width:80ch;margin:0;padding:10px 14px;background:#fdfdf8;color:#1b1b1b;font-family:var(--f-mono);font-size:13px;border-radius:2px;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.dist{display:grid;grid-template-columns:minmax(0,1fr) minmax(80px,180px) 54px;gap:6px 10px;align-items:center;font-size:13px}
.dist .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dist .b{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.dist .b i{display:block;height:100%;border-radius:4px}
.autod{display:flex;flex-direction:column;gap:8px;font-size:13px}.autod .ar{display:grid;grid-template-columns:170px minmax(60px,1fr) 80px 150px;gap:4px 12px;align-items:center;grid-template-areas:"l b n x"}
.autod .l{grid-area:l;white-space:nowrap}.autod .b{grid-area:b}.autod .n{grid-area:n;text-align:right}.autod .x{grid-area:x}
.autod .b{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}.autod .b i{display:block;height:100%;border-radius:4px}
.autod .x{text-align:right;white-space:nowrap}
@media (max-width:640px){.autod .ar{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"l n" "b b" "x x"}.autod .x{text-align:left}}
.hardlist{display:flex;flex-direction:column;gap:2px}
.hard{display:grid;grid-template-columns:34px minmax(0,1fr) minmax(90px,200px) 70px;gap:10px;align-items:center;padding:7px 8px;border-radius:var(--r);border:0;background:none;text-align:left;width:100%;color:var(--fg)}
.hard:hover{background:var(--surface-2)}
.qrows{display:flex;flex-direction:column;gap:2px}
.qrow{display:grid;grid-template-columns:44px minmax(0,230px) 1fr 72px;gap:4px 12px;align-items:center;border:0;background:none;color:var(--fg);text-align:left;width:100%;padding:6px 8px;border-radius:var(--r);font:inherit}
.qrow:hover{background:var(--surface-2)} .qrow.on{background:var(--accent-soft)}
.qrow .qid{font-family:var(--f-mono);font-size:11px;color:var(--fg-3)}
.qrow .qt{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qrow.on .qt{font-weight:600}
.qrow .qbar{display:flex;height:14px;border-radius:3px;overflow:hidden;gap:2px;background:var(--surface-2)}
.qrow .qbar i{display:block;height:100%}
.qrow .qv{text-align:right;font-size:12.5px;display:flex;flex-direction:column;line-height:1.15}
.qrow .qv small{color:var(--fg-3);font-size:10.5px}
@media (max-width:640px){.qrow{grid-template-columns:36px minmax(0,1fr) 62px;padding:8px 6px}.qrow .qt{white-space:normal}.qrow .qbar{grid-column:2/3;grid-row:2}.qrow .qv{grid-row:1/3;grid-column:3}}
.tls{display:flex;flex-direction:column;gap:4px}
.tl{display:grid;grid-template-columns:minmax(0,320px) 1fr 64px;gap:14px;align-items:center;border:0;background:none;color:var(--fg);text-align:left;width:100%;padding:8px;border-radius:var(--r)}
.tl:hover{background:var(--surface-2)}
.tl-h{display:flex;gap:10px;align-items:center;min-width:0}
.tl-h>span:last-child{display:flex;flex-direction:column;min-width:0}
.tl-h b{font-family:var(--f-display);font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-b{display:flex;height:18px;border-radius:4px;overflow:hidden;gap:2px;background:var(--surface-2)}
.tl-b i{display:block;height:100%}
.tl-v{text-align:right;font-size:15px}
@media (max-width:640px){.tl{grid-template-columns:1fr 54px}.tl-h{grid-column:1/-1}}
.nlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.nlist li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 10px;align-items:center;padding:6px 8px;border-radius:var(--r)}
.nlist li .nm{display:flex;flex-direction:column;min-width:0}
.nlist li .foot{overflow:hidden;text-overflow:ellipsis}
.nlist:not(.pick) li{grid-template-columns:minmax(120px,200px) minmax(0,1fr) auto auto}
.nlist.pick{max-height:34vh;overflow-y:auto;border:1px solid var(--line);border-radius:var(--r);padding:4px}
.nlist.pick li{grid-template-columns:auto minmax(0,1fr) auto auto;cursor:pointer}
.nlist.pick li:hover{background:var(--surface-2)} .nlist.pick li.on{background:var(--accent-soft)}
@media (max-width:640px){.nlist:not(.pick) li{grid-template-columns:1fr auto}.nlist:not(.pick) li .foot{grid-column:1/-1}}
.drawer.wide{width:min(720px,100%)}
.field select{border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:6px 8px}
.backbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.crow{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;font-weight:500}
.crow input{grid-column:1/-1}
.hard .sb{display:flex;height:10px;border-radius:3px;overflow:hidden;gap:1px}
.hard .sb i{display:block;height:100%}

.tbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.search{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:6px 12px;flex:1 1 200px;max-width:300px}
.search input{border:0;background:transparent;outline:none;width:100%}
.tscroll{overflow:auto;max-height:72vh;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:13px;background:var(--surface)}
th,td{padding:7px 12px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--grid)}
th{position:sticky;top:0;z-index:1;background:#202522;font-family:var(--f-display);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3);font-weight:600;user-select:none}
th.sort{cursor:pointer} th.sort:hover{color:var(--fg)}
th .ar{font-size:10px;margin-left:3px;color:var(--accent)}
td.r,th.r{text-align:right}
tbody tr.st{cursor:pointer}
tbody tr.st:hover{background:var(--surface-2)}
.chip{display:inline-flex;align-items:center;gap:5px;font-weight:600;font-size:12px;padding:2px 9px;border-radius:999px;white-space:nowrap;font-family:var(--f-display)}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.chip.jeu{background:color-mix(in srgb,var(--jeu) 22%,transparent);color:var(--fg)} .chip.jeu i{background:var(--jeu)}
.chip.el{background:color-mix(in srgb,var(--el) 22%,transparent);color:var(--fg)} .chip.el i{background:var(--el)}
.chip.mx{background:color-mix(in srgb,var(--mx) 18%,transparent);color:var(--fg)} .chip.mx i{background:linear-gradient(90deg,var(--jeu) 50%,var(--el) 50%)}
.chip.none{background:var(--surface-2);color:var(--fg-3)}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)}
.ms{display:inline-flex;gap:3px}
.ms i{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;font-family:var(--f-title);font-style:normal;font-size:10px;background:transparent;color:var(--fg-3);border:1px solid var(--line)}
.ms i.v{color:#15170a;border-color:transparent}
.ms i.v:nth-child(1){background:var(--m1);color:var(--m1-on)} .ms i.v:nth-child(2){background:var(--m2);color:var(--m2-on)} .ms i.v:nth-child(3){background:var(--m3);color:var(--m3-on)} .ms i.v:nth-child(4){background:var(--m4);color:var(--m4-on)} .ms i.v:nth-child(5){background:var(--m5);color:var(--m5-on)} .ms i.v:nth-child(6){background:var(--m6);color:var(--m6-on)}
.ms i.p{border-style:dashed;color:var(--fg-2);border-color:var(--fg-3)}
.ms i.l{box-shadow:0 0 0 2px var(--warn)}
.ms i.x{border:1px dashed var(--bad);color:var(--bad)}
.qc{display:inline-flex;gap:2px}
.qc i{display:grid;place-items:center;width:18px;height:18px;border-radius:3px;font-style:normal;font-family:var(--f-mono);font-size:10px;background:var(--surface-2);color:var(--fg-3)}
.qc i.c0{background:var(--e0);color:#08140b} .qc i.c1{background:var(--e1);color:#fff} .qc i.c2{background:var(--e2);color:#1b1405} .qc i.c3{background:var(--e3);color:#1b0906}
.mini{display:inline-flex;align-items:center;gap:8px}
.mini .track{display:block;width:56px;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.mini .fill{display:block;height:100%;border-radius:3px}
.empty{padding:28px;text-align:center;color:var(--fg-3);margin:0}
.foot{font-size:12px;color:var(--fg-3)}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;justify-content:flex-end}
.drawer{background:var(--surface);width:min(520px,100%);height:100%;overflow-y:auto;padding:22px max(20px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) 20px;display:flex;flex-direction:column;gap:18px;border-left:4px solid var(--accent)}
.drawer .hd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.drawer .hd h2{font-family:var(--f-title);font-weight:400;text-transform:none;letter-spacing:.01em}
dl.meta{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;margin:0;font-size:13px}
dl.meta dt{color:var(--fg-3)} dl.meta dd{margin:0}
.cmp{display:flex;flex-direction:column;gap:14px}
.cmp .it{display:flex;flex-direction:column;gap:5px}
.cmp .h{display:flex;justify-content:space-between;gap:8px;font-size:13px;align-items:center}
.bar2{position:relative;height:10px;border-radius:5px;background:var(--surface-2)}
.bar2 .f{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.bar2 .m{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--fg)}
.field{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--fg-2);font-weight:600;min-width:0;font-family:var(--f-display);letter-spacing:.02em}
.field input,.field textarea,.field select{border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:8px 10px;font-weight:400;font-size:14px;width:100%;font-family:var(--f-body);letter-spacing:0}
.field textarea{min-height:110px;resize:vertical;line-height:1.5}
.help{font-size:12px;color:var(--fg-3);margin:0;font-weight:400;font-family:var(--f-body);letter-spacing:0}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-weight:600;padding:9px 18px;border-radius:999px;font-size:13px;z-index:95;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.5)}

/* Rapports */
.mailgrid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.mailgrid{grid-template-columns:1fr}}
.mlist{padding:0;gap:0;overflow:hidden}
.mlist .search{margin:12px;max-width:none;flex:none}
.mlist ul{list-style:none;margin:0;padding:0;max-height:70vh;overflow-y:auto;border-top:1px solid var(--line)}
.mlist li{display:flex;flex-direction:column;gap:3px;padding:9px 14px;border-bottom:1px solid var(--grid);cursor:pointer}
.mlist li:hover{background:var(--surface-2)}
.mlist li[aria-selected="true"]{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.mlist .l1{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13px}
.mlist .l2{font-size:11px;color:var(--fg-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mlist .l2.miss{color:var(--bad);font-weight:600}
.tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:1px 6px;border-radius:3px;background:var(--surface-2);color:var(--fg-3);font-family:var(--f-display)}
.tag.ai{background:var(--accent-soft);color:var(--accent)} .tag.edit{background:var(--warn-soft);color:var(--warn)}
.envelope{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;font-size:13px}
.envelope dt{color:var(--fg-3)} .envelope dd{margin:0;overflow-wrap:anywhere}
.mailbody{white-space:pre-wrap;font-size:13.5px;line-height:1.55;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:0;max-width:75ch;font-family:var(--f-body)}
/* aperçu du rapport : document de laboratoire du jeu */
.paper{background:#fdfdf8;color:#1b1b1b;border-radius:3px;max-width:620px;width:100%;font-size:12px;box-shadow:0 12px 40px rgba(0,0,0,.55);font-family:var(--f-mono);padding:20px 24px 22px;display:flex;flex-direction:column;gap:12px}
.paper .rh{display:flex;justify-content:space-between;align-items:center;border:1.5px solid #222;padding:6px 10px;font-size:11px;letter-spacing:.04em}
.paper .rh img{width:40px;height:40px;border-radius:50%}
.paper .rt{text-align:center;font-family:var(--f-body);font-weight:600;font-size:17px;margin:0}
.paper .rs{text-align:center;margin:-8px 0 0;color:#5d625f;font-family:var(--f-body);font-size:12.5px}
.paper .ql{display:grid;grid-template-columns:auto 1fr auto;gap:3px 10px;font-size:11.5px;align-items:baseline}
.paper .qi{color:#8a8f8a}
.paper .qr{font-weight:600;font-family:var(--f-body);color:#8a8f8a;text-align:right}
.paper .qr.c0{color:#2f9e44}.paper .qr.c1{color:#8a6a2e}.paper .qr.c2{color:#c4520e}.paper .qr.c3{color:#d9443a}
.paper .who{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12px}
.paper .who b{font-weight:600}
.paper .stamp{align-self:flex-start;font-family:var(--f-stamp);font-size:14px;letter-spacing:.12em;text-transform:uppercase;border:3px solid currentColor;padding:2px 10px;transform:rotate(-3deg);border-radius:3px}
.paper .stamp.ok{color:#2f9e44} .paper .stamp.late{color:#c4520e} .paper .stamp.ko{color:#d9443a}
.paper .pk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.paper .pk div{border:1.5px solid #222;padding:6px 8px}
.paper .pk b{display:block;font-family:var(--f-title);font-weight:400;font-size:19px}
.paper .pk span{color:#5d625f;font-size:10px}
.paper .pm{display:grid;grid-template-columns:auto 1fr 52px;gap:7px 10px;align-items:center}
.paper .pm .mn{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;font-family:var(--f-title);font-size:10px;margin-right:6px}
.paper .pm .bar2{background:#e4e5de}
.paper .pm .bar2 .m{background:#1b1b1b}
.paper .pt{text-align:center;text-decoration:underline;font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
.paper ul{margin:0;padding-left:16px}
.paper .ap{border:1.5px solid #222;padding:10px 12px;white-space:pre-wrap;line-height:1.5;font-family:var(--f-body);font-size:12.5px}
.paper .nt{border:1.5px solid #c4520e;color:#8a3a0a;padding:7px 10px;font-family:var(--f-body);font-size:12px}
.paper .nt.ko{border-color:#d9443a;color:#a12a22}
.paper .ind{font-family:var(--f-body);font-style:italic;font-size:11px;color:#5d625f;margin-top:-6px}
.paper .sg{text-align:right;color:#4b524e;font-family:var(--f-hand);font-size:20px}

/* Feuilles d'exercices */
.tags{display:inline-flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.tag.ex{background:color-mix(in srgb,var(--acc) 22%,transparent);color:var(--fg)}
.exlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.exlist li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:var(--r);padding:8px 10px}
.exlist li>.num{font-family:var(--f-title);font-size:16px;color:var(--fg-3);text-align:center}
.ext{display:flex;flex-direction:column;gap:2px;min-width:0}.ext b{font-weight:600;font-size:13.5px}
.exb{display:flex;gap:4px}
.ib{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--fg-2);font-size:13px;display:inline-grid;place-items:center;padding:0}
.ib:hover:not(:disabled){border-color:var(--acc);color:var(--fg)}.ib:disabled{opacity:.3;cursor:default}
.mtag2{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--c);color:var(--cn);font-family:var(--f-title);font-size:9px;vertical-align:1px;margin-right:2px}
.exgrid{display:flex;flex-direction:column;gap:6px}
.excard{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r)}
.excard summary{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;list-style:none}
.excard summary::-webkit-details-marker{display:none}
.excard .chev{color:var(--fg-3);font-size:18px;transition:transform .15s}.excard[open] .chev{transform:rotate(90deg)}
.excard[open]{border-color:var(--acc)}
.exf{display:flex;flex-direction:column;gap:10px;padding:2px 12px 12px}
.exf textarea{min-height:0;font-family:var(--f-mono);font-size:13px}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--fg-2)}
.chk input{width:16px;height:16px;accent-color:var(--acc)}
.paper .ex{display:flex;flex-direction:column;gap:5px;border-left:3px solid #1b1b1b;padding-left:10px}
.paper .exh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:var(--f-body)}
.paper .exh b{font-size:13px}.paper .exh span{color:#5d625f;font-size:10.5px}
.paper .exe{white-space:pre-wrap;font-family:var(--f-body);font-size:12.5px;line-height:1.5}
.paper .exr{display:flex;flex-direction:column;gap:6px;border:1.5px dashed #8a8f8a;padding:8px 10px}
.paper .exr div{display:grid;grid-template-columns:auto 1fr;gap:10px;font-family:var(--f-body);font-size:11.5px}
.paper .exr span{white-space:pre-wrap}
.exfig{margin:4px 0 0;display:flex;flex-direction:column;gap:3px;max-width:100%}

.exfig figcaption{font-family:var(--f-body);font-style:italic;font-size:10.5px;color:#5d625f}
.bankfig{background:#fdfdf8;padding:8px;border-radius:3px;align-self:flex-start;width:min(100%,560px)}

/* Débriefing en classe */
.stage{container-type:inline-size;aspect-ratio:16/9;width:100%;max-width:100%;border-radius:var(--r);overflow:hidden;position:relative;color:#eef0e6;font-family:var(--f-body);--sc:#e3b02a;
  background:linear-gradient(180deg,rgba(11,13,12,.86),rgba(11,13,12,.94)),url("a/hall.webp") center/cover,#0b0d0c;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.stage:fullscreen{aspect-ratio:auto;width:100vw;height:100vh;border-radius:0}
.stage::after{content:"";position:absolute;left:0;right:0;bottom:0;height:.8cqw;background:repeating-linear-gradient(135deg,var(--sc) 0 1.2cqw,#111 1.2cqw 2.4cqw)}
.sl{position:absolute;inset:0 0 5cqw 0;padding:4cqw 5cqw 0;display:flex;flex-direction:column;gap:1.6cqw;overflow:hidden}
.sl[data-m="1"]{--sc:var(--m1)} .sl[data-m="2"]{--sc:var(--m2)} .sl[data-m="3"]{--sc:var(--m3)} .sl[data-m="4"]{--sc:var(--m4)} .sl[data-m="5"]{--sc:var(--m5)} .sl[data-m="6"]{--sc:var(--m6)}
.stage:has(.sl[data-m="1"]){--sc:var(--m1);background-image:linear-gradient(180deg,rgba(11,13,12,.82),rgba(11,13,12,.93)),url("a/door1.webp")}
.stage:has(.sl[data-m="2"]){--sc:var(--m2);background-image:linear-gradient(180deg,rgba(11,13,12,.82),rgba(11,13,12,.93)),url("a/machines.webp")}
.stage:has(.sl[data-m="3"]){--sc:var(--m3);background-image:linear-gradient(180deg,rgba(11,13,12,.82),rgba(11,13,12,.93)),url("a/lockers.webp")}
.stage:has(.sl[data-m="4"]){--sc:var(--m4);background-image:linear-gradient(180deg,rgba(11,13,12,.82),rgba(11,13,12,.93)),url("a/office.webp")}
.stage:has(.sl[data-m="5"]){--sc:var(--m5);background-image:linear-gradient(180deg,rgba(11,13,12,.82),rgba(11,13,12,.93)),url("a/office.webp");background-position:22% 50%}
.stage:has(.sl[data-m="6"]){--sc:var(--m6);background-image:linear-gradient(180deg,rgba(11,13,12,.82),rgba(11,13,12,.93)),url("a6/atelier.webp")}
.sl .bars.dense{gap:.3cqw}.sl .bars.dense .br{font-size:1.1cqw}.sl .bars.dense .br .tr{height:1.1cqw}
.sl .bars.compact{gap:.55cqw;margin-top:.6cqw}
.sl .bars.compact .br{grid-template-columns:24cqw 1fr 6cqw;font-size:1.3cqw;font-weight:500}
.sl .bars.compact .br .tr{height:1.5cqw}
.sl .eb{font-family:var(--f-stamp);color:var(--sc);letter-spacing:.2em;font-size:1.4cqw;text-transform:uppercase}
.sl h1{font-family:var(--f-title);font-weight:400;font-size:4.2cqw;line-height:1.08;color:#fff}
.sl h2{font-family:var(--f-display);font-size:2.5cqw;line-height:1.2;color:#fff;font-weight:600;text-transform:none;letter-spacing:0}
.sl p{margin:0;font-size:1.7cqw;color:#c9cfc6;max-width:80cqw}
.sl .kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(14cqw,1fr));gap:1.4cqw;margin-top:auto;margin-bottom:2cqw}
.sl .kp div{border:1px solid rgba(255,255,255,.18);border-top:.4cqw solid var(--sc);border-radius:.5cqw;padding:1.4cqw 1.6cqw;background:rgba(0,0,0,.45)}
.sl .kp b{display:block;font-family:var(--f-title);font-weight:400;font-size:3.8cqw;color:#fff;line-height:1}
.sl .kp span{font-size:1.3cqw;color:#a9b0a6}
.sl .bars{display:flex;flex-direction:column;gap:1.2cqw;margin-top:1cqw}
.sl .br{display:grid;grid-template-columns:20cqw 1fr 7cqw;gap:1.5cqw;align-items:center;font-size:1.6cqw;font-family:var(--f-display);font-weight:600}
.sl .br .tr{height:2.2cqw;border-radius:.6cqw;background:rgba(255,255,255,.08);overflow:hidden;display:flex;gap:.2cqw}
.sl .br .tr i{display:block;height:100%}
.sl .br b{font-family:var(--f-mono);font-weight:500;text-align:right}
.sl .opt{display:grid;grid-template-columns:1fr 20cqw 6cqw;gap:1.2cqw;align-items:center;font-size:1.7cqw;padding:.7cqw 1.2cqw;border-radius:999px;background:rgba(255,255,255,.06);border:.2cqw solid transparent;font-family:var(--f-display)}
.sl .opt.ok{border-color:#3fae55;background:rgba(47,158,68,.2)}
.sl .opt .tr{height:1.4cqw;border-radius:.5cqw;background:rgba(255,255,255,.08);overflow:hidden}
.sl .opt .tr i{display:block;height:100%;background:#a9b0a6}
.sl .opt.ok .tr i{background:#3fae55}
.sl .opt b{font-family:var(--f-mono);font-weight:500;text-align:right}
.sl .ans{font-size:1.8cqw;border-left:.5cqw solid #3fae55;padding:.6cqw 1.4cqw;background:rgba(47,158,68,.18);border-radius:0 .8cqw .8cqw 0;color:#fff}
.sl .mtag{display:inline-grid;place-items:center;font-family:var(--f-title);font-size:1.2cqw;width:2.6cqw;height:2.6cqw;border-radius:50%;background:var(--c,var(--sc));color:var(--cn,#1b1405);margin-right:1cqw;vertical-align:.1cqw;letter-spacing:0}
.sl .qsplit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:2.4cqw;flex:1;min-height:0;align-items:start}
.sl .qtxt{display:flex;flex-direction:column;gap:1.2cqw;min-width:0}
.sl.withimg h2{font-size:2cqw}
.sl.withimg .opt{font-size:1.45cqw;grid-template-columns:1fr 12cqw 5cqw}
.sl .qfig{margin:0;background:#fff;border-radius:.6cqw;padding:.6cqw;display:flex;align-items:center;justify-content:center;max-height:40cqw;overflow:hidden;box-shadow:0 .6cqw 2cqw rgba(0,0,0,.45)}
.sl .qfig img{display:block;max-width:100%;max-height:38.5cqw;object-fit:contain}
.sl .two{display:grid;grid-template-columns:1fr 1fr;gap:3cqw}
.sl ol{margin:0;padding-left:2.4cqw;display:flex;flex-direction:column;gap:.8cqw;font-size:1.8cqw}
.sl .rev{align-self:flex-start;font-family:var(--f-display);font-size:1.5cqw;padding:.8cqw 2cqw;border-radius:999px;border:0;background:var(--sc);color:#111;font-weight:600}
.sl .cardm{background:var(--sc);color:#111;border-radius:.5cqw;padding:2.2cqw 2.6cqw;box-shadow:0 1cqw 3cqw rgba(0,0,0,.5);display:flex;flex-direction:column;gap:.6cqw;align-self:flex-start;max-width:80cqw}
.sl[data-m="2"] .cardm,.sl[data-m="3"] .cardm,.sl[data-m="4"] .cardm,.sl[data-m="5"] .cardm,.sl[data-m="6"] .cardm{color:#fff}
.sl .cardm .eb{color:inherit;opacity:.85}
.sl .cardm h1{color:inherit}
.sfoot{position:absolute;left:5cqw;right:5cqw;bottom:1.8cqw;display:flex;justify-content:space-between;font-size:1.2cqw;color:#a9b0a6;font-family:var(--f-stamp);letter-spacing:.14em}
.pjctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots button{min-width:30px;height:28px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-mono);font-size:12px}
.dots button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.doc{display:flex;flex-direction:column;gap:16px;max-width:900px}
.doc p,.doc li{max-width:72ch}
.doc code{font-family:var(--f-mono);font-size:12.5px;background:var(--surface-2);padding:1px 5px;border-radius:3px;color:var(--accent)}

function sim2(K,m,w0,E,tmax,n=600){const dt=tmax/n/20;let y=0,v=0,t=0;const P=[[0,0]];
  for(let i=1;i<=n;i++){for(let k=0;k<20;k++){const a=w0*w0*(K*E-y)-2*m*w0*v;v+=a*dt;y+=v*dt;t+=dt}P.push([t,y])}return P}
const sim1=(K,tau,E,tmax,y0=0,n=300)=>Array.from({length:n+1},(_,i)=>{const t=tmax*i/n;return [t,y0+K*E*(1-Math.exp(-t/tau))]});
/* repère linéaire ou logarithmique en x */
function frame({x,y,box,xt,yt,xl,yl,logx,xf=v=>nf(v),yf=v=>nf(v),title}){
  const [X,Y,W,H]=box,sx=logx?v=>X+(Math.log10(v)-Math.log10(x[0]))/(Math.log10(x[1])-Math.log10(x[0]))*W:v=>X+(v-x[0])/(x[1]-x[0])*W,sy=v=>Y+H-(v-y[0])/(y[1]-y[0])*H;
  let g=`<rect x="${X}" y="${Y}" width="${W}" height="${H}" fill="#fff" stroke="${FK.ink}" stroke-width=".8"/>`;
  (xt||[]).forEach(t=>{g+=`<line x1="${sx(t)}" x2="${sx(t)}" y1="${Y}" y2="${Y+H}" stroke="${FK.grid}" stroke-width=".7"/><text x="${sx(t)}" y="${Y+H+12}" font-size="10" text-anchor="middle" fill="${FK.dim}" ${FF}>${xf(t)}</text>`});
  (yt||[]).forEach(t=>{g+=`<line x1="${X}" x2="${X+W}" y1="${sy(t)}" y2="${sy(t)}" stroke="${FK.grid}" stroke-width=".7"/><text x="${X-5}" y="${sy(t)+3.5}" font-size="10" text-anchor="end" fill="${FK.dim}" ${FF}>${yf(t)}</text>`});
  if(xl)g+=`<text x="${X+W}" y="${Y+H+26}" font-size="10.5" text-anchor="end" fill="${FK.ink}" ${FF}>${xl}</text>`;
  if(yl)g+=`<text x="${X}" y="${Y-5}" font-size="10.5" fill="${FK.ink}" ${FF}>${yl}</text>`;
  if(title)g+=`<text x="${X+W/2}" y="${Y-5}" font-size="11" font-weight="bold" text-anchor="middle" fill="${FK.ink}" ${FF}>${title}</text>`;
  const path=(P,col,w=1.8,dash)=>{let d="",up=false;P.forEach(([a,b])=>{const yy=sy(b),ok=isFinite(yy)&&yy>=Y-1&&yy<=Y+H+1;if(ok){d+=(up?"L":"M")+sx(a).toFixed(1)+" "+yy.toFixed(1);up=true}else up=false});return `<path d="${d}" fill="none" stroke="${col}" stroke-width="${w}"${dash?` stroke-dasharray="${dash}"`:""}/>`};
  const dot=(a,b,col=FK.mark)=>`<circle cx="${sx(a)}" cy="${sy(b)}" r="3.2" fill="${col}"/>`;
  const txt=(a,b,s,o={})=>`<text x="${sx(a)+(o.dx||0)}" y="${sy(b)+(o.dy||0)}" font-size="${o.fs||10.5}" fill="${o.col||FK.ink}" text-anchor="${o.anchor||"start"}" ${o.bold?'font-weight="bold"':""} ${FF}>${s}</text>`;
  const hl=(b,col=FK.dim,dash="4 3")=>`<line x1="${X}" x2="${X+W}" y1="${sy(b)}" y2="${sy(b)}" stroke="${col}" stroke-dasharray="${dash}" stroke-width="1"/>`;
  const vl=(a,col=FK.dim,dash="4 3")=>`<line x1="${sx(a)}" x2="${sx(a)}" y1="${Y}" y2="${Y+H}" stroke="${col}" stroke-dasharray="${dash}" stroke-width="1"/>`;
  return {g,sx,sy,path,dot,txt,hl,vl};
}
const svgWrap=(W,H,body)=>`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}"><rect width="${W}" height="${H}" fill="#fff"/>${body}</svg>`;
const logTicks=(a,b)=>{const L=[];for(let e=Math.floor(Math.log10(a));e<=Math.ceil(Math.log10(b));e++){const v=10**e;if(v>=a*0.999&&v<=b*1.001)L.push(v)}return L};
const wfmt=v=>v>=1?String(v):"10"+String(Math.round(Math.log10(v))).replace("-","⁻").replace(/\d/g,d=>"⁰¹²³⁴⁵⁶⁷⁸⁹"[d]);
const wGrid=(a,b)=>{const L=[];for(let e=Math.floor(Math.log10(a));e<Math.ceil(Math.log10(b));e++)for(let k=1;k<10;k++){const v=k*10**e;if(v>=a&&v<=b)L.push(v)}return L};
/* Bode (gain + phase) */
function bode({w,G,P,gy,py,gt,pt,W=520,marks=[]}){
  const H1=150,H2=110,X=52,Wp=W-70,N=200,ws=Array.from({length:N+1},(_,i)=>w[0]*(w[1]/w[0])**(i/N));
  const f1=frame({x:w,y:gy,box:[X,22,Wp,H1],yt:gt,logx:true,yl:"G (dB)"}),f2=frame({x:w,y:py,box:[X,22+H1+18,Wp,H2],xt:logTicks(...w),yt:pt,logx:true,xf:wfmt,xl:"ω (rad/s)",yl:"φ (°)",yf:v=>String(v).replace("-","−")});
  let g=f1.g+f2.g;wGrid(...w).forEach(v=>{g+=`<line x1="${f1.sx(v)}" x2="${f1.sx(v)}" y1="22" y2="${22+H1}" stroke="${FK.grid}" stroke-width=".4"/><line x1="${f1.sx(v)}" x2="${f1.sx(v)}" y1="${40+H1}" y2="${40+H1+H2}" stroke="${FK.grid}" stroke-width=".4"/>`});
  g+=f1.path(ws.map(v=>[v,G(v)]),FK.a,2)+f2.path(ws.map(v=>[v,P(v)]),FK.b,2);
  marks.forEach(mk=>{const f=mk.ph?f2:f1;g+=f.dot(mk.w,mk.v)+(mk.t?f.txt(mk.w,mk.v,mk.t,{dx:6,dy:mk.dy??-6,fs:10}):"")});
  return svgWrap(W,H1+H2+70,g);
}

function blocks({pre=[],main,ret,inL="E(p)",outL="S(p)",W=560}){
  const H=ret!==undefined?150:90,y=40,bh=36;let x=10,g=`<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="${FK.ink}"/></marker></defs>`;
  const arrow=(x1,y1,x2,y2)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${FK.ink}" stroke-width="1.3" marker-end="url(#ah)"/>`;
  const bw=t=>Math.max(44,t.length*6.4+18);
  const box=(t,x0)=>{const w=bw(t);g+=`<rect x="${x0}" y="${y-bh/2}" width="${w}" height="${bh}" fill="#fff" stroke="${FK.ink}" stroke-width="1.3"/><text x="${x0+w/2}" y="${y+4}" font-size="12" text-anchor="middle" fill="${FK.ink}" ${FF}>${t}</text>`;return x0+w};
  g+=`<text x="${x}" y="${y-10}" font-size="11" fill="${FK.ink}" ${FF}>${inL}</text>`;const L0=Math.max(34,inL.length*6+30);
  pre.forEach((t,i)=>{const l=i?34:L0;g+=arrow(x,y,x+l,y);x=box(t,x+l)});
  const l1=pre.length?34:L0;g+=arrow(x,y,x+l1,y);const cx=x+l1+12;g+=`<circle cx="${cx}" cy="${y}" r="12" fill="#fff" stroke="${FK.ink}" stroke-width="1.3"/><line x1="${cx-8}" y1="${y-8}" x2="${cx+8}" y2="${y+8}" stroke="${FK.ink}"/><line x1="${cx-8}" y1="${y+8}" x2="${cx+8}" y2="${y-8}" stroke="${FK.ink}"/><text x="${cx-20}" y="${y-12}" font-size="12" fill="${FK.ink}" ${FF}>+</text><text x="${cx+5}" y="${y+26}" font-size="13" fill="${FK.ink}" ${FF}>−</text>`;
  x=cx+12;main.forEach(t=>{g+=arrow(x,y,x+30,y);x=box(t,x+30)});
  const xo=x+30;g+=arrow(x,y,xo+30,y)+`<text x="${xo+4}" y="${y-8}" font-size="11" fill="${FK.ink}" ${FF}>${outL}</text>`;
  if(ret!==undefined){const yr=y+72;g+=`<circle cx="${xo}" cy="${y}" r="2.5" fill="${FK.ink}"/><line x1="${xo}" y1="${y}" x2="${xo}" y2="${yr}" stroke="${FK.ink}" stroke-width="1.3"/>`;
    if(ret){const w=bw(ret),bx=(cx+xo)/2-w/2;g+=arrow(xo,yr,bx+w,yr);const save=y;g+=`<rect x="${bx}" y="${yr-bh/2}" width="${w}" height="${bh}" fill="#fff" stroke="${FK.ink}" stroke-width="1.3"/><text x="${bx+w/2}" y="${yr+4}" font-size="12" text-anchor="middle" fill="${FK.ink}" ${FF}>${ret}</text><line x1="${bx}" y1="${yr}" x2="${cx}" y2="${yr}" stroke="${FK.ink}" stroke-width="1.3"/>`}
    else g+=`<line x1="${xo}" y1="${yr}" x2="${cx}" y2="${yr}" stroke="${FK.ink}" stroke-width="1.3"/>`;
    g+=arrow(cx,yr,cx,y+12)}
  return svgWrap(Math.max(W,xo+70),H,g);
}

/* ---------- Calculs ---------- */
/* format de chaque mission (escape game ou e-learning) ; un élève peut changer de format d'une mission à l'autre */
const missionMode=(s,n)=>s.mm?.[n]||s.baseMode||null;

  return set.size>1?"mixte":set.size?[...set][0]:s.mode||null}
function rosterOf(s){if(!D.roster)return null;return D.roster.find(x=>norm(x.nom)===norm(s.nom)&&(!x.prenom||!s.prenom||norm(x.prenom)===norm(s.prenom)))||null}
/* une mission par semaine : la mission n se prépare avant le cours n */
const dl=n=>(D.courses||[])[n-1]??null;
const anyDl=()=>(D.courses||[]).some(v=>v!=null);
const nowT=()=>{const d=new Date();return Date.UTC(d.getFullYear(),d.getMonth(),d.getDate(),d.getHours(),d.getMinutes())};
const MSTATUS={atemps:["Validée avant le cours","good"],fini:["Validée","good"],retard:["Validée après le cours","warn"],cours:["En cours","none"],inach:["Inachevée au cours","bad"],nonfait:["Non faite au cours","bad"],attente:["Pas commencée","none"]};

  if(m.state==="v"){if(d==null)return "fini";const f=m.fin??(s.last!=null&&s.last<=d?s.last:null);return f==null?"fini":f<=d?"atemps":"retard"}

    const pts=Q.reduce((a,q)=>a+(s.items[q.id]?.pts||0),0);
    const allOk=Q.every(q=>s.items[q.id]&&s.items[q.id].pts!=null); // une question enregistrée est une question réussie (on ne passe pas sans la bonne réponse)
    const o={n:m.n,state:done.length===0?"none":allOk?"v":"p",done:done.length,tot:Q.length,note:allOk?20*pts/Q.length:null,partial:done.length?20*pts/Q.length:null,
      first:done.length?100*done.filter(q=>s.items[q.id].err===0).length/done.length:null,err:done.reduce((a,q)=>a+(s.items[q.id].err||0),0),tps:s.tps?.[m.n]??null,res:s.res?.[m.n]??null,fin:s.fin?.[m.n]??null,ind:s.ind?.[m.n]??null,auto:s.auto?.[m.n]??null,mode:done.length?missionMode(s,m.n):null};
    o.status=mStatus(o,s);return o});
  const vals=Object.values(s.items).filter(it=>it.pts!=null);
  const started=vals.length>0,nv=ms.filter(m=>m.state==="v").length,fini=nv===NM;
  const note=fini?20*ptsSum(s)/QB.length:null;
  const first=vals.length?100*vals.filter(it=>it.err===0).length/vals.length:null;

  const tpsTot=ms.some(m=>m.tps!=null)?ms.reduce((a,m)=>a+(m.tps||0),0)/60:null;
  const dur=tpsTot; // temps d'activité envoyé par le paquet SCORM (M{n}_TPS) ; jamais déduit des dates Moodle

}
let ROWS=[];

const stKey=()=>/^m\d$/.test(ui.view)?ui.view:"global";
function statusOpts(k){

/* ---------- Ponctualité : une mission par semaine, à faire avant son cours ---------- */
const dayLbl=t=>t==null?"":new Date(t).toLocaleDateString("fr-FR",{timeZone:"UTC",weekday:"long",day:"numeric",month:"long"});

    <p class="foot" style="margin:0">À droite : part des élèves qui ont validé la mission avant son cours (une fois le cours passé). Clique une mission pour ouvrir son onglet.</p>`;
}
function weekCurve(R,n){
  const d=dl(n);if(d==null)return settingsHint(`Indique la date du cours de la mission ${n} dans les`,"pour suivre le rythme de la semaine.");
  const DAY=86400000,t0=d-7*DAY,t1=d+2*DAY,N=R.length||1,now=nowT();
  const V=R.map(s=>stats(s).ms[n-1]).filter(m=>m.state==="v"),fins=V.map(m=>m.fin).filter(v=>v!=null).sort((a,b)=>a-b),noDate=V.length-fins.length;
  const W=760,H=230,L=40,Rr=18,T=18,B=30,pw=W-L-Rr,ph=H-T-B,x=t=>L+(Math.max(t0,Math.min(t1,t))-t0)/(t1-t0)*pw,y=v=>T+ph-v/100*ph;
  let g=`<rect x="${x(d)}" y="${T}" width="${x(t1)-x(d)}" height="${ph}" style="fill:var(--bad-soft)"/>`;
  [0,25,50,75,100].forEach(v=>{g+=`<line class="gl" x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}%</text>`});
  for(let k=0;k<=9;k++){const t=t0+k*DAY;g+=`<text x="${x(t)}" y="${T+ph+16}" text-anchor="middle"${k===7?' class="lbl"':""}>${k===7?"Cours":k<7?"J−"+(7-k):"J+"+(k-7)}</text>`}
  g+=`<line x1="${x(d)}" x2="${x(d)}" y1="${T-6}" y2="${T+ph}" stroke="var(--fg-2)" stroke-dasharray="4 3"/>`;
  const tEnd=Math.min(t1,now);
  if(tEnd>t0){let p="",a=`M${x(t0)} ${y(0)}`;const steps=240;
    for(let k=0;k<=steps;k++){const t=t0+k*(tEnd-t0)/steps,v=100*fins.filter(f=>f<=t).length/N;p+=(k?"L":"M")+x(t).toFixed(1)+" "+y(v).toFixed(1);a+="L"+x(t).toFixed(1)+" "+y(v).toFixed(1)}
    a+=`L${x(tEnd)} ${y(0)}Z`;
    g+=`<path d="${a}" style="fill:color-mix(in srgb,var(--acc) 20%,transparent)"/><path d="${p}" fill="none" style="stroke:var(--acc)" stroke-width="2"/>`;
    const vE=100*fins.filter(f=>f<=tEnd).length/N;g+=`<circle cx="${x(tEnd)}" cy="${y(vE)}" r="4" style="fill:var(--acc)" stroke="var(--surface)" stroke-width="2"/>`;
    if(now>=d){const vD=100*fins.filter(f=>f<=d).length/N;g+=`<text class="val" x="${x(d)-8}" y="${Math.max(T+10,y(vD)-8)}" text-anchor="end">${Math.round(vD)} % avant le cours</text>`}
    else g+=`<text class="val" x="${x(tEnd)-8}" y="${Math.max(T+10,y(vE)-8)}" text-anchor="end">${Math.round(vE)} % à ce jour</text>`}
  if(now>t0&&now<t1)g+=`<line x1="${x(now)}" x2="${x(now)}" y1="${T}" y2="${T+ph}" stroke="var(--fg-3)" stroke-dasharray="1 3"/><text x="${x(now)+4}" y="${T-5}">aujourd'hui</text>`;
  if(now<=t0)g+=`<text class="lbl" x="${L+pw/2}" y="${T+ph/2}" text-anchor="middle">La semaine de la mission ${n} n'a pas commencé.</text>`;
  return `<div class="legend"><span><i style="background:var(--acc)"></i>Part de ${scopeLbl()==="Promotion"?"la promotion":"la "+scopeLbl().toLowerCase()} ayant validé la mission ${n}</span><span><i style="background:var(--bad-soft)"></i>Après le cours</span></div>
    <div class="xscroll"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Validation de la mission ${n} au fil de sa semaine">${g}</svg></div>
    ${noDate?`<p class="foot" style="margin:0">${noDate} validation${noDate>1?"s":""} sans date : le paquet SCORM doit envoyer M${n}_FIN pour situer chaque validation dans la semaine.</p>`:""}`;
}
function hardList(A,list,limit){
  const L=list.map(q=>({q,a:qAgg(A,q)})).filter(o=>o.a.n>=3).sort((x,y)=>hardScore(y.a)-hardScore(x.a)).slice(0,limit);

function scatter(A){
  const W=760,H=290,L=44,Rr=14,T=14,B=36,pw=W-L-Rr,ph=H-T-B;

  const dmax=Math.max(30,...P.map(o=>o.st.dur)),step=dmax>240?60:dmax>120?30:15,xmax=Math.ceil(dmax/step)*step,xs=v=>L+v/xmax*pw,ys=v=>T+ph-v/20*ph;

  const head=`<div class="ph"><h2>Auto-positionnement</h2><p>posé à la fin de la mission, avant le code d'accès</p></div><p class="enonce" style="margin:0;padding:8px 12px;background:#fdfdf8;color:#1b1b1b;font-family:var(--f-mono);font-size:13px;border-radius:2px">${esc(AUTOQ(n))}</p>`;
  if(!N)return `<div class="panel">${head}<p class="empty">Pas encore de réponse (interaction M${n}_AUTO dans l'export).</p></div>`;
  const rows=[5,4,3,2,1].map(k=>{const G=L.filter(m=>Math.round(m.auto)===k),c=G.length,nt=mean(G.map(m=>m.note).filter(v=>v!=null)),er=mean(G.filter(m=>m.state==="v").map(m=>m.err));
    return `<div class="ar"><span class="l"><span style="color:var(--accent);letter-spacing:1px">${starsTxt(k)}</span> <span class="foot">${AUTOL[k]}</span></span><span class="b"><i style="width:${100*c/N}%;background:var(--acc)"></i></span><span class="num n">${c} · ${Math.round(100*c/N)} %</span><span class="num foot x">${nt==null?"–":fmt(nt)+" /20"}${er==null?"":" · "+fmt(er)+" err."}</span></div>`}).join("");
  return `<div class="panel">${head}
    <div class="autod">${rows}</div>
    <p class="foot" style="margin:0">À droite : note moyenne de la mission et erreurs moyennes des élèves de chaque niveau, pour comparer le ressenti aux résultats. Moyenne : ${fmt(mean(L.map(m=>m.auto)))} / 5 sur ${N} élève${N>1?"s":""}.</p></div>`;
}
function firstAnswers(A,q){
  const M=new Map();A.forEach(s=>{const it=s.items[q.id];if(!it||!it.resp)return;const k=norm(it.resp);if(!M.has(k))M.set(k,{t:it.resp,n:0,ok:false});const o=M.get(k);o.n++;if(it.err===0)o.ok=true});
  if(q.o){q.o.forEach(o=>{const k=norm(o);if(!M.has(k))M.set(k,{t:o,n:0,ok:false});if(o===q.ans)M.get(k).ok=true})}
  const L=[...M.values()];const tot=L.reduce((a,o)=>a+o.n,0);
  return {L:q.o?L.sort((x,y)=>q.o.indexOf(x.t)-q.o.indexOf(y.t)):L.sort((x,y)=>y.n-x.n).slice(0,8),tot};
}

    <p class="enonce">${esc(q.q)}</p>

    ${fa.tot?`<h3 style="font-size:13px">Réponses données au premier essai</h3><div class="dist">${fa.L.map(o=>`<span class="t" title="${esc(o.t)}">${o.ok?"✓ ":""}${esc(o.t)}</span><span class="b"><i style="width:${fa.tot?100*o.n/fa.tot:0}%;background:${o.ok?"var(--good)":"var(--fg-3)"}"></i></span><span class="num">${fa.tot?Math.round(100*o.n/fa.tot):0} %</span>`).join("")}</div>`

const mChip=m=>{const [l,c]=MSTATUS[m.status];return `<span class="chip ${c}">${l}${m.status==="cours"||m.status==="inach"?" · "+m.done+"/"+m.tot:""}</span>`};
const msDots=st=>`<span class="ms">${st.ms.map(x=>{const c=x.state==="v"?"v"+(x.status==="retard"?" l":""):x.status==="inach"||x.status==="nonfait"?"x":x.state==="p"?"p":"";
  return `<i class="${c}" title="Mission ${x.n} : ${MSTATUS[x.status][0].toLowerCase()}${x.fin?" le "+dateFmt(x.fin):""}">${x.n}</i>`}).join("")}</span>`;
function colsFor(scope){
  if(scope==="global")return [["nom","Nom"],["prenom","Prénom"],["group","Classe"],["mode","Format"],["status","Parcours"],["nv","Missions"],["ontime","Avant le cours",1],["note","Note /20",1],["first","1er essai",1],["errs","Erreurs",1],["ind","Indices",1],["dur","Temps d'activité",1],["nuit","Tard le soir",1]];
  return [["nom","Nom"],["prenom","Prénom"],["group","Classe"],["mode","Format"],["mstate","Mission"],["mfin","Validée le"],["mnote","Note /20",1],["merr","Erreurs",1],["mind","Indices",1],["mauto","Auto",1],["mq","Questions"],["mtps","Temps d'activité",1]];
}
const MORD={atemps:6,fini:5,retard:4,cours:3,inach:2,nonfait:1,attente:0};
function sortVal(s,k,scope){const st=stats(s),mi=scope==="global"?0:+scope[1]-1,m=st.ms[mi];
  switch(k){case "nom":return norm(s.nom);case "prenom":return norm(s.prenom);case "group":return st.group;case "mode":return (scope==="global"?s.mode:m.mode)||"z";case "status":return st.status;case "ind":return st.ind??-1;case "nuit":{const d=deepest(st.night||[]);return d?d.depth:-1}case "mind":return m.ind??-1;case "mauto":return m.auto??-1;
    case "ontime":return st.due?st.ontime/st.due:-1;case "mstate":return MORD[m.status];case "mfin":return m.fin??Infinity;
    case "mnote":return m.note??-1;case "merr":return m.state==="none"?-1:m.err;case "mtps":return m.tps??-1;case "mq":return m.err;default:return st[k]??-1}}
function tableRows(R,scope){
  const t=norm(ui.q),L=R.filter(s=>!t||norm(s.nom+" "+s.prenom).includes(t));
  const {k,dir}=ui.sort;L.sort((a,b)=>{const x=sortVal(a,k,scope),y=sortVal(b,k,scope);return (x<y?-1:x>y?1:0)*dir||norm(a.nom).localeCompare(norm(b.nom))});return L;
}

function autoComment(s,sc){

    else if(st.note>=16)P.push(`Très beau parcours : les ${NM} missions sont validées avec peu d'erreurs.`);
    else if(st.note>=12)P.push(`Les ${NM} missions sont validées, avec quelques hésitations.`);
    else P.push(`Les ${NM} missions sont validées, mais au prix de nombreux essais : certaines notions ne sont pas encore solides.`);
    if(st.late||st.missing)P.push(T(`${st.late+st.missing} mission${st.late+st.missing>1?"s n'ont":" n'a"} pas été faite${st.late+st.missing>1?"s":""} avant ${st.late+st.missing>1?"leur":"son"} cours : chaque mission prépare la séance qui suit, garde ce rythme d'une mission par semaine.`,`${st.late+st.missing} mission${st.late+st.missing>1?"s n'ont":" n'a"} pas été faite${st.late+st.missing>1?"s":""} avant ${st.late+st.missing>1?"leur":"son"} cours : chaque mission prépare la séance qui suit, gardez ce rythme d'une mission par semaine.`));

async function getDl(){try{return window.claude?.use?await window.claude.use("downloads"):null}catch(_){return null}}
async function saveFile(name,data,okMsg){
  const dlc=await getDl();
  if(!dlc){try{const blob=data instanceof Blob?data:new Blob([data]);const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},4000);toast(okMsg);return true}catch(_){toast("Le téléchargement n'a pas abouti dans ce navigateur.");return false}}
  try{await dlc.save({filename:name,data});toast(okMsg);return true}
  catch(e){if(e?.code!=="declined")toast(e?.code==="rate_limited"?"Une demande d'enregistrement est déjà ouverte.":"Enregistrement impossible ici ("+(e?.code||"erreur")+").");return false}
}

    questions:qOfMission(sc).map(q=>({notion:q.t,resultat:errTxt(s.items[q.id])})),prochaine_mission:sc<NM?{mission:sc+1,cours:courseLbl(sc+1)||null}:null}}

    reussite_1er_essai_pct:st.first==null?null:Math.round(st.first),missions:st.ms.map((m,j)=>({mission:m.n,titre:MISSIONS[j].t,statut:MSTATUS[m.status][0],note:r1(m.note),erreurs:m.state==="none"?null:m.err,moyenne:r1(a.ms[j])})),
    questions_difficiles:weakQs(s).map(q=>({mission:q.m,notion:q.t,erreurs:s.items[q.id].err}))}}
async function aiOne(s,sc,signal){
  const prompt=`Tu es enseignant d'automatique en école d'ingénieur (2e année). Les élèves préparent chaque cours en classe inversée avec la « Mission Rétro-automatique » (escape game ou e-learning, au choix et modifiable à chaque mission ; les indices demandés coûtent des points dans le score du jeu mais ne changent pas la note) : une mission par semaine, à faire avant le cours qui suit. Une question ne peut pas être ratée : l'élève recommence jusqu'à la bonne réponse, chaque erreur retire 0,25 point.
Rédige l'appréciation ${sc?`du rapport de la mission ${sc}`:`du bilan des ${NM} missions`} : 2 à 4 phrases, ${D.vous?"en vouvoyant l'élève":"en tutoyant l'élève"}, ton bienveillant et factuel, sans formule d'appel ni signature, sans inventer d'information absente des données, en citant au plus deux notions à retravailler. Si "horaire_tardif" est renseigné, ajoute une phrase bienveillante, sans reproche, qui conseille de travailler à un moment où la fatigue pèse moins.
Données : ${JSON.stringify(aiPayload(s,sc))}
Réponds uniquement avec un objet JSON {"appreciation": "..."}.`;
  const out=await sampleNS.json(prompt,{signal,modelTier:"quick"});
  if(out&&typeof out.appreciation==="string"&&out.appreciation.trim()){D.comments[ckey(sc,s)]={text:out.appreciation.trim(),src:"ai"};save()}
}
async function aiAll(R,sc){
  aiStop=new AbortController();render();let n=0;
  try{for(const s of R){if(aiStop.signal.aborted)break;if(D.comments[ckey(sc,s)]?.src==="edit")continue;await aiOne(s,sc,aiStop.signal);n++;if(ui.view==="mail")render()}toast(n+" appréciations rédigées")}
  catch(e){toast(aiErr(e))}finally{aiStop=null;render()}
}

/* D.exo : edits (modifications de la banque), custom (exercices ajoutés), sheets (feuille modifiée à la main, par mission et par élève) */
const EXMAX=4,EXMIN=2;
function exoD(){if(!D.exo||typeof D.exo!=="object")D.exo={};const x=D.exo;x.edits=x.edits||{};x.custom=Array.isArray(x.custom)?x.custom:[];x.sheets=x.sheets||{};return x}
function exAll(){const x=exoD();return [...EXB.map(e=>{const d=x.edits[e.id];return d?{...e,...d,base:true,mod:true}:{...e,base:true}}),...x.custom.map(e=>({...e,m:NIDX[e.n]?.m||e.m,custom:true}))].filter(e=>NIDX[e.n])}
const exById=id=>exAll().find(e=>e.id===id);
const exOfNotion=n=>exAll().filter(e=>e.n===n);
/* notions de la mission où l'élève a commis des erreurs, de la plus coûteuse à la moins coûteuse */
function weakNotions(s,sc){
  const W={};qOfMission(sc).forEach(q=>{const it=s.items[q.id];if(it&&it.pts!=null&&it.err>0){const n=Q2N[q.id];if(n)W[n]=(W[n]||0)+it.err}});
  return NOTIONS.filter(n=>W[n.id]).map(n=>({...n,err:W[n.id]})).sort((a,b)=>b.err-a.err||NOTIONS.indexOf(a)-NOTIONS.indexOf(b));
}
function proposeSheet(s,sc){
  if(!sc)return [];const st=stats(s);if(st.ms[sc-1].state==="none")return [];
  const WN=weakNotions(s,sc);if(!WN.length)return [];
  const tot=WN.reduce((a,n)=>a+n.err,0),N=Math.min(EXMAX,Math.max(EXMIN,WN.length+(tot>=6?1:0)));
  const pools=WN.map(n=>exOfNotion(n.id).filter(e=>!e.off)),out=[];
  for(let r=0;out.length<N&&pools.some(p=>p.length>r);r++)for(const p of pools){if(out.length>=N)break;if(p[r])out.push(p[r].id)}
  return out;
}
function sheetOf(s,sc){
  if(!sc)return {ids:[],src:"none"};const k=ckey(sc,s),c=exoD().sheets[k];
  if(c&&Array.isArray(c.ids))return {ids:c.ids.filter(id=>exById(id)),src:"edit"};
  return {ids:proposeSheet(s,sc),src:"auto"};
}
const sheetEx=(s,sc)=>sheetOf(s,sc).ids.map(exById).filter(Boolean);

const notionsTxt=E=>[...new Set(E.map(e=>lc(NIDX[e.n].t)))].join(", ");

/* ---------- Format SCORM ---------- */
function renderFormat(v){
  v.innerHTML=`<div class="doc">
  <div class="panel"><h2>Ce que le tableau de bord lit</h2>
    <p style="margin:0">Le rapport <b>Interactions</b> de l'activité SCORM dans Moodle, téléchargé en Excel, ODS ou CSV, avec les options <b>Réponse</b>, <b>Bonne réponse</b> et <b>Résultat</b> cochées. Une ligne par tentative, puis pour chaque interaction les colonnes « Question n », « Réponse n », « Bonne réponse n », « Résultat n ».</p>
    <p class="foot" style="margin:0">Les intitulés exacts des colonnes de Moodle n'ont pas été vérifiés sur ta version : la lecture accepte les variantes françaises et anglaises courantes. Si un import échoue, le message indique ce qui manque.</p>
    <ol><li>Activité SCORM → <b>Rapports</b> → onglet <b>Interactions</b>.</li><li>Coche Réponse, Bonne réponse et Résultat, choisis « toutes les tentatives ».</li>
      <li>Télécharge en Excel, puis importe le fichier avec « Importer un export Moodle ».</li><li>Si l'escape game et l'e-learning sont deux activités Moodle, importe les deux exports : le tableau demande la modalité de chacun si elle n'est pas dans le fichier.</li>
      <li>Importe aussi la liste des élèves (Nom, Prénom, Classe, E-mail) : elle donne les classes, les adresses des rapports et repère qui n'a pas commencé.</li></ol></div>
  <div class="panel"><h2>Convention à respecter dans le paquet SCORM</h2>
    <p style="margin:0">Une question ne peut pas être ratée : l'élève recommence jusqu'à la bonne réponse. Le paquet enregistre donc, pour chaque question, <b>combien d'essais</b> il a fallu et <b>la première réponse</b> donnée.</p>
    <ul><li><code>cmi.interactions.n.id</code> = <code>M{mission}_{question}</code>, par exemple <code>M2_d5</code>. Identifiants communs à l'escape game et à l'e-learning ; l'ordre d'envoi n'a pas d'importance.</li>
      <li><code>result</code> = les points obtenus, de 0 à 1 : 1 au premier essai, −0,25 par erreur (0,75 ; 0,5 ; 0,25 ; 0 à partir de 4 erreurs). <b>Les indices n'entrent pas dans ce calcul</b> : leur pénalité (−5 pts) ne s'applique qu'au score du jeu.</li>
      <li><code>learner_response</code> = la réponse donnée au <b>premier essai</b>, en clair (texte de l'option, valeur saisie). C'est ce qui alimente les réponses fausses les plus fréquentes et le débriefing.</li>
      <li><code>M1_MODE</code>… <code>M6_MODE</code> : format dans lequel la mission a été <b>validée</b> (<code>jeu</code> ou <code>classique</code>). Depuis la V2, l'élève peut changer de format en cours de route et une mission validée dans un format l'est aussi dans l'autre : le paquet doit envoyer les résultats du format où la mission a réellement été jouée, pas les réponses recopiées automatiquement. <code>MODE</code> seul reste accepté pour tout le parcours.</li>
      <li><b>Erreurs question par question dans l'escape game aussi</b> : dans la V2, le jeu compte les erreurs globalement (pour son score), sans les rattacher à une question. Le paquet SCORM devra mémoriser les erreurs de chaque question dans le jeu, sinon ces missions n'auront pas de détail par question.</li>
      <li>Facultatif mais utile pour repérer le travail tard le soir : <code>M1_DEB</code>… <code>M6_DEB</code>, l'heure à laquelle l'élève a commencé la mission (même format que <code>M1_FIN</code>). Sans elles, le tableau s'appuie sur les heures de validation, le début de l'activité et le dernier accès.</li>
      <li>Facultatif : <code>M1_IND</code>… <code>M6_IND</code> (nombre d'indices demandés pendant la mission) et <code>SCORE</code> (score du jeu en points : départ 100, +10 par bonne réponse, −10 par erreur, −5 par indice ; c'est le seul indicateur touché par les indices), avec le résultat <code>neutral</code>.</li>
      <li>Facultatif : <code>M1_AUTO</code>… <code>M6_AUTO</code>, l'auto-positionnement de fin de mission (1 à 5 étoiles) dans <code>learner_response</code>, avec le résultat <code>neutral</code>. Missions 1 à 3 : « ${esc(AUTOQ(1))} » ; missions 4 à 6 : « ${esc(AUTOQ(4))} »</li>
      <li><b>Indispensable avec une mission par semaine</b> : <code>M1_FIN</code>… <code>M4_FIN</code>, la date de validation de chaque mission (AAAA-MM-JJ HH:MM), avec le résultat <code>neutral</code>. Moodle ne garde qu'une date de dernier accès pour toute l'activité : sans ces dates, le tableau ne peut pas dire si chaque mission a été faite avant son cours.</li>
      <li><code>M1_TPS</code>… <code>M6_TPS</code> : <b>temps d'activité</b> dans la mission, en secondes, avec le résultat <code>neutral</code>. Le paquet le chronomètre lui-même (Moodle ne le fournit pas) et ne compte que le temps réellement actif : l'onglet du jeu est visible et l'élève a agi (clic, touche, défilement) ou regarde une vidéo depuis moins de 2 minutes. Une pause plus longue arrête le compteur jusqu'à la prochaine action. Le temps s'additionne d'une session à l'autre jusqu'à la validation de la mission. Sans ces valeurs, les colonnes de temps restent vides.</li>
      <li>Facultatif : <code>M1_RES</code>… (ressources consultées), avec le résultat <code>neutral</code>.</li>
      <li><code>cmi.core.score.raw</code> = note sur 100, pour le carnet de notes de Moodle.</li></ul></div>
  <div class="panel"><div class="ph"><h2>Identifiants des ${QB.length} questions</h2><button class="btn" type="button" id="btnCopyQB">Copier la liste</button></div>
    <div class="tscroll" style="max-height:none"><table><thead><tr><th>Identifiant SCORM</th><th>Mission</th><th>Question</th><th>Bonne réponse</th></tr></thead><tbody>
    ${QB.map(q=>`<tr><td class="num">M${q.m}_${q.id}</td><td><span class="mlabel" data-m="${q.m}">M${q.m}</span></td><td>${esc(q.t)}</td><td style="white-space:normal;min-width:220px">${esc(q.ans)}</td></tr>`).join("")}</tbody></table></div></div></div>`;
  $("#btnCopyQB").onclick=()=>copy(QB.map(q=>`M${q.m}_${q.id}\tMission ${q.m}\t${q.t}\t${q.ans}`).join("\n"));
}

/* ---------- Travail tard le soir : repérage et notification ---------- */
const LATE=()=>{const L=D.late||{};return{from:L.from??22,to:L.to??6,inReport:true}};
const hFr=m=>`${Math.floor(m/60)} h${m%60?" "+String(m%60).padStart(2,"0"):""}`;
const lateWin=()=>`entre ${LATE().from} h et ${LATE().to} h`;
/* heures relevées : début et validation de chaque mission (M{n}_DEB, M{n}_FIN), début de l'activité et dernier accès Moodle */
function nightHits(s){
  const{from,to}=LATE();if(from===to)return [];const f=from*60,t=to*60;
  const inW=m=>f<t?m>=f&&m<t:m>=f||m<t,depth=m=>(m-f+1440)%1440,L=[],seen=new Set();
  const add=(v,n,kind)=>{if(v==null||seen.has(v))return;seen.add(v);const d=new Date(v),m=d.getUTCHours()*60+d.getUTCMinutes();
    if(inW(m))L.push({t:v,m,n,kind,at:hFr(m),night:m<6*60,depth:depth(m),fmt:n?missionMode(s,n):null})};
  MISSIONS.forEach(x=>{add(s.fin?.[x.n],x.n,"fin");add(s.deb?.[x.n],x.n,"deb")});
  add(s.start,null,"start");add(s.last,null,"last");
  return L.sort((a,b)=>b.t-a.t);
}
const deepest=H=>H.reduce((b,h)=>!b||h.depth>b.depth?h:b,null);
function momentsTxt(H){
  const by=new Map();H.forEach(h=>{const k=h.n||0;if(!by.has(k)||h.depth>by.get(k).depth)by.set(k,h)});
  const parts=[...by.values()].sort((a,b)=>(a.n||99)-(b.n||99)).map(h=>h.n?`mission ${h.n} vers ${h.at}`:`connexion vers ${h.at}`);
  return parts.length>1?parts.slice(0,-1).join(", ")+" et "+parts.at(-1):parts[0]||"";
}
/* mention dans le rapport individuel de la mission */
function nightNote(s,sc){const H=(stats(s).night||[]).filter(h=>h.n===sc),d=deepest(H);if(!d)return null;
  const ats=[...new Set(H.sort((a,b)=>a.t-b.t).map(h=>h.at))];
  return {night:d.night,txt:`Travail ${d.night?"en pleine nuit":"tard le soir"} sur cette mission (vers ${ats.length>1?ats.slice(0,-1).join(", ")+" et "+ats.at(-1):ats[0]}).`}}

/* ---------- Import ---------- */
function msg(html,cls,keep){const box=$("#msgs");const d=document.createElement("div");d.className="msg "+cls;d.innerHTML=html;box.append(d);if(!keep)setTimeout(()=>d.remove(),9000);return d}
function readFile(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{try{res(XLSX.read(new Uint8Array(r.result),{type:"array"}))}catch(e){rej(e)}};r.onerror=rej;r.readAsArrayBuffer(f)})}
function leaveDemo(){if(demo){D=emptyD();demo=false}}
async function importFiles(files){
  if(typeof XLSX==="undefined"){msg("Import impossible : la bibliothèque de lecture des fichiers Excel ne s'est pas chargée (connexion ou navigateur qui la bloque). Recharge la page ; si le problème persiste, ouvre le tableau de bord dans une fenêtre normale.","err",true);return}
  for(const f of files){
    try{const wb=await readFile(f);let got=null,lastErr="";
      for(const sn of wb.SheetNames){const R=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:null});const p=parseSheet(R,f.name);if(p.err){lastErr=p.err;continue}got=p;break}
      if(!got){msg(`<b>${esc(f.name)}</b> : ${esc(lastErr)}.`,"err",true);continue}
      leaveDemo();
      commit(f.name,got);
    }catch(e){msg(`<b>${esc(f.name)}</b> : fichier illisible (${esc(e.message||e)}). Exporte le rapport au format Excel, ODS ou CSV.`,"err",true)}
  }
}
function commit(name,got){
  const had=D.files.length>0;
  D.raw=got.rows.slice();rebuild();D.files=[{name,n:got.rows.length,at:nowT()}];save();
  const nAct=D.students.filter(x=>Object.keys(x.items).length).length;
  msg(`<b>${esc(name)}</b> : ${got.rows.length} ligne${got.rows.length>1?"s":""} lue${got.rows.length>1?"s":""}, ${nAct} élève${nAct>1?"s":""} avec des réponses, ${got.matched} réponses reconnues.${had?" Les données précédentes ont été remplacées par cet export.":""}${got.unknown.length?` Identifiants ignorés : ${esc(got.unknown.slice(0,6).join(", "))}${got.unknown.length>6?"…":""}.`:""}${!anyDl()?` <button class="linkbtn" type="button" data-open-settings>Indique les dates des ${NM} cours</button> pour suivre les délais de chaque mission.`:""}`,"ok");
  document.querySelectorAll("#msgs [data-open-settings]").forEach(b=>b.onclick=openSettings);
  render();
}
function askMode(){
  const p=pending[0];if(!p||$("#askMode"))return;
  const n=p.got.rows.filter(s=>!s.mode&&!Object.keys(s.mm||{}).length).length;
  const d=msg(`<span><b>${esc(p.name)}</b> : ${n} ligne${n>1?"s":""} sans modalité indiquée. Ce fichier vient de quelle activité ?</span><button class="btn" type="button" data-m="jeu">Escape game</button><button class="btn" type="button" data-m="el">E-learning</button>`,"ask",true);

}
async function importRoster(f){
  try{const wb=await readFile(f);const R=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:null});
    const hr=findHeader(R);if(hr<0){msg("Liste des élèves : il faut une ligne d'en-tête avec au moins une colonne Nom.","err",true);return}
    const H=R[hr].map(norm),fi=re=>H.findIndex(h=>re.test(h));
    const cN=fi(/^(nom|last ?name|surname|nom de famille)$/),cP=fi(/^(prenom|first ?name)$/),cF=fi(/^(nom complet|full ?name|prenom ?\/ ?nom|nom ?\/ ?prenom|name)$/),cG=fi(/^(classe|groupe|group|gr\.?)$/),cM=fi(/mail|courriel/);
    const L=[];R.slice(hr+1).forEach(r=>{if(!r)return;let nom=cN>=0?String(r[cN]??"").trim():"",prenom=cP>=0?String(r[cP]??"").trim():"";
      if(!nom&&cF>=0){const sp=splitName(r[cF]);nom=sp.nom;prenom=sp.prenom}if(!nom)return;
      L.push({nom,prenom,group:cG>=0?String(r[cG]??"").trim():"",email:cM>=0?String(r[cM]??"").trim():""})});
    if(!L.length){msg("Liste des élèves : aucun nom trouvé.","err",true);return}
    leaveDemo();D.roster=L;save();msg(`Liste importée : ${L.length} élèves${cG<0?" (pas de colonne Classe)":""}${cM<0?" (pas de colonne E-mail)":""}.`,"ok");render();
  }catch(e){msg("Liste des élèves illisible : "+esc(e.message||e),"err",true)}
}

/* ---------- Démarrage ---------- */
loadLocal();
if(demo){D=makeDemo();rebuild()}
$("#btnImport").onclick=()=>$("#fileIn").click();
$("#fileIn").onchange=e=>{importFiles([...e.target.files]);e.target.value=""};
$("#btnRoster").onclick=()=>$("#rosterIn").click();
$("#rosterIn").onchange=e=>{if(e.target.files[0])importRoster(e.target.files[0]);e.target.value=""};
$("#btnSettings").onclick=openSettings;
document.addEventListener("dragover",e=>e.preventDefault());
document.addEventListener("drop",e=>{e.preventDefault();const fs=[...(e.dataTransfer?.files||[])];if(fs.length)importFiles(fs)});
const h=location.hash.slice(1);if(VIEWS.some(v=>v[0]===h))ui.view=h;
render();
initStore();
(async()=>{try{sampleNS=window.claude?.use?await window.claude.use("sample"):null}catch(_){sampleNS=null}if(sampleNS&&ui.view==="mail")render()})();
})();
</script>
