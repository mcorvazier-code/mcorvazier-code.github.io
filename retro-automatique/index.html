<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mission Rétro-automatique</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Caveat:wght@500;700&family=Nunito:wght@600&family=Russo+One&family=Chakra+Petch:wght@400;500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout : une scène 16:9 qui s'adapte à l'écran, des points d'intérêt en %, des fenêtres (popups) et des panneaux de mission par-dessus. Univers unique, sombre (choix délibéré). */
:root{
  color-scheme: dark;
  --night:#0b0d0c;          /* fond de page */
  --soot:#161a18;           /* surfaces sombres */
  --steel:#2a302d;          /* bordures */
  --paper:#eef0e6;          /* texte clair */
  --dim:#a9b0a6;            /* texte secondaire */
  --ok:#2f9e44; --ko:#d9443a; --warn:#e8742a; --gold:#e3b02a;
  --m1:#b6c10e; --m1-on:#15170a;
  --m2:#1197bd; --m2-on:#ffffff;
  --m3:#cf3cbb; --m3-on:#ffffff;
  --m4:#c4520e; --m4-on:#ffffff;
  --acc:var(--m1); --on:var(--m1-on);
  --f-title:"Russo One","Chakra Petch",system-ui,sans-serif;
  --f-stamp:"Black Ops One","Chakra Petch",Impact,sans-serif;
  --f-ui:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
/* surfaces teintées dans la couleur de la mission (lisibles quel que soit --on) */
body,.pop,.card,.docview{--tint:color-mix(in srgb,var(--on) 13%,transparent);--tint2:color-mix(in srgb,var(--on) 22%,transparent);--sunk:color-mix(in srgb,#000 22%,var(--acc))}
body[data-m="2"]{--acc:var(--m2);--on:var(--m2-on);--mt-alpha:55%}
body[data-m="3"]{--acc:var(--m3);--on:var(--m3-on);--mt-alpha:55%}
body[data-m="4"]{--acc:var(--m4);--on:var(--m4-on);--mt-alpha:55%}
body[data-m="5"]{--acc:var(--gold);--on:#1b1405}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--night);color:var(--paper);font-family:var(--f-body);font-size:15px;line-height:1.5;overflow:hidden;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#app{position:fixed;inset:0;display:grid;place-items:center;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#stage{position:relative;width:min(100vw,177.78vh);aspect-ratio:16/9;max-width:100%;max-height:100%;overflow:hidden;background:#000;container-type:inline-size}
.bg{position:absolute;inset:0;background-size:cover;background-position:center;transition:filter .5s}
.bg.blur{filter:blur(6px) brightness(.55);transform:scale(1.04)}
.mtitle{position:absolute;left:0;top:0;z-index:3;font-family:var(--f-title);font-weight:400;letter-spacing:0;color:color-mix(in srgb,var(--acc) var(--mt-alpha,70%),transparent);background:rgba(80,80,80,.55);padding:.15em .6em;font-size:clamp(12px,2.4cqw,30px);max-width:90%;pointer-events:none}
.hud{position:absolute;right:8px;top:8px;z-index:30;display:flex;gap:6px;pointer-events:auto}
.hud button{color:#fff;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:4px 10px;font-family:var(--f-ui);font-size:12px;cursor:pointer}
.hud button:hover{border-color:var(--acc)}
.oscbtn{position:absolute;z-index:31;width:clamp(52px,6.6cqw,72px);height:clamp(52px,6.6cqw,72px);padding:0;border-radius:50%;border:2px solid var(--acc);background:transparent;cursor:pointer;pointer-events:auto;box-shadow:0 4px 16px rgba(0,0,0,.45);transition:transform .2s}
@media (max-height:520px),(max-width:520px){#ui:has(.layer) .oscbtn{opacity:0;pointer-events:none}}
.fullbtn{position:absolute;z-index:31;width:42px;height:42px;border-radius:10px;border:1px solid rgba(255,255,255,.35);background:rgba(10,14,16,.72);color:#fff;display:grid;place-items:center;cursor:pointer;pointer-events:auto;box-shadow:0 3px 10px rgba(0,0,0,.4)}
.fullbtn:hover,.fullbtn:focus-visible{border-color:var(--acc);color:var(--acc)}
#classic .fullbtn{position:fixed;left:14px;bottom:14px}
@media (max-height:520px),(max-width:520px){#ui:has(.layer) .fullbtn{opacity:0;pointer-events:none}}
.oscbtn .rb{display:block;width:100%;height:100%;animation:rbBob 3.2s ease-in-out infinite}
.oscbtn:hover,.oscbtn:focus-visible{transform:scale(1.08)}
.oscbtn .tip{position:absolute;right:calc(100% + 8px);top:50%;transform:translateY(-50%);white-space:nowrap;background:rgba(0,0,0,.75);color:#fff;font:12px var(--f-ui);padding:3px 8px;border-radius:3px;opacity:0;pointer-events:none;transition:opacity .2s}
.oscbtn:hover .tip,.oscbtn:focus-visible .tip{opacity:1}
.rb-eye{animation:rbBlink 5s infinite;transform-origin:center;transform-box:fill-box}
@keyframes rbBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes rbBlink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@media (prefers-reduced-motion:reduce){.oscbtn .rb,.rb-eye{animation:none}}
.hmenu{position:relative}
.hm-list{position:absolute;right:0;top:100%;padding-top:6px;display:none;flex-direction:column;gap:4px;min-width:190px}
.hm-list button{white-space:nowrap}
.hmenu:hover .hm-list,.hmenu:focus-within .hm-list,.hmenu.open .hm-list{display:flex}
.hm-list button{text-align:left;border-radius:6px!important;padding:6px 12px!important;background:rgba(0,0,0,.82)!important;color:#fff!important}
.hm-list button.profon{background:var(--gold)!important;color:#1b1405!important;border-color:var(--gold)!important}
.hud-score{display:inline-flex;align-items:center;color:#1b1405;background:var(--gold);border-radius:999px;padding:4px 12px;font:700 12px var(--f-ui);white-space:nowrap}
.hud-score.hit{animation:scoreHit .6s ease}.hud-score.up{animation:scoreUp .6s ease}
@keyframes scoreUp{0%{background:#2f9e44;color:#fff;transform:scale(1.12)}100%{background:var(--gold);color:#1b1405;transform:none}}
@keyframes scoreHit{0%{background:#d9443a;color:#fff;transform:scale(1.12)}100%{background:var(--gold);color:#1b1405;transform:none}}
@media (prefers-reduced-motion:reduce){.hud-score.hit,.hud-score.up{animation:none}}
.hud button.profon{background:var(--gold);color:#1b1405;border-color:var(--gold);font-weight:700}

/* points d'intérêt */
.spot{position:absolute;z-index:2;width:clamp(22px,2.6cqw,34px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:2px solid #fff;background:var(--acc);color:var(--on);display:grid;place-items:center;cursor:pointer;box-shadow:0 0 0 0 color-mix(in srgb,var(--acc) 70%,transparent);animation:pulse 2.2s infinite;padding:0}
.spot svg{width:58%;height:58%}
.spot.lock{background:var(--warn);color:#fff}
.spot.trap{background:var(--acc)}
.spot.hidden{background:transparent;border-color:transparent;animation:glint 4s infinite;box-shadow:none;width:clamp(30px,4cqw,50px)}
.spot:hover{transform:translate(-50%,-50%) scale(1.15)}
.profbtn{position:absolute;right:max(10px,1.2cqw);bottom:max(10px,1.2cqw);z-index:4;background:rgba(0,0,0,.45);color:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:3px 10px;font-family:var(--f-ui);font-size:11px;cursor:pointer}
.proffloat{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);transform:translateX(-50%);z-index:30;pointer-events:auto;background:var(--gold);color:#1b1405;border:0;border-radius:999px;padding:5px 14px;font-family:var(--f-ui);font-weight:700;font-size:12px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.5)}
.profbtn:hover{color:#fff;border-color:#fff}
.card.prof{background:#23282a;color:#eef0e6;max-width:900px}
.card.prof .stamp{color:var(--gold)}
.psec{border-left:4px solid var(--c);padding:4px 0 8px 12px;margin:10px 0}
.psec h4{margin:0 0 6px;font-family:var(--f-ui);color:var(--c);font-size:15px}
.pm1{--c:var(--m1)}.pm2{--c:var(--m2)}.pm3{--c:var(--m3)}.pm4{--c:var(--m4)}
.pchips{display:flex;flex-wrap:wrap;gap:6px}
.pchip{font-family:var(--f-ui);font-size:12px;font-weight:600;background:transparent;color:#eef0e6;border:1px solid color-mix(in srgb,var(--c) 70%,transparent);border-radius:999px;padding:3px 10px;cursor:pointer}
.pchip:hover{background:color-mix(in srgb,var(--c) 30%,transparent)}
.pmiss{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px}
.pmis{display:flex;flex-direction:column;gap:2px;text-align:left;background:color-mix(in srgb,var(--c) 18%,transparent);border:2px solid var(--c);color:#eef0e6;border-radius:6px;padding:10px 12px;cursor:pointer;font-family:var(--f-ui)}
.pmis b{color:var(--c);font-size:18px}.pmis span{font-size:15px}
.card.prof{font-size:16px}.card.prof .hint{font-size:15px}.card.prof .btn{font-size:15px}
.pmis:hover{background:color-mix(in srgb,var(--c) 32%,transparent)}
.pm5{--c:var(--gold)}
.pkh{font-family:var(--f-ui);color:var(--gold);margin:14px 0 6px}
.card.prof .table{font-size:15px}
.card.prof .btn.ghost{color:#eef0e6}
.notebook{position:relative;display:flex;width:min(100%,620px);max-height:100%;filter:drop-shadow(0 14px 30px rgba(0,0,0,.6));transform:rotate(-.6deg)}
.nb-rings{flex:none;width:34px;border-radius:6px 0 0 6px;background:linear-gradient(90deg,#3b2a1c,#5a4029 60%,#3b2a1c);position:relative}
.nb-rings::before{content:"";position:absolute;inset:14px 0;background:radial-gradient(circle at 26px 50%,#1b130c 0 5px,transparent 5.5px) 0 0/34px 34px repeat-y,
  linear-gradient(90deg,transparent 14px,#b9b3a6 14px 30px,transparent 30px) 0 0/34px 34px;-webkit-mask:linear-gradient(180deg,#000 0 13px,transparent 13px 34px) 0 7px/34px 34px repeat-y;mask:linear-gradient(180deg,#000 0 13px,transparent 13px 34px) 0 7px/34px 34px repeat-y}
.nb-page{flex:1;min-width:0;overflow:auto;color:#26323a;padding:22px 46px 20px 58px;border-radius:0 6px 6px 0;font-family:"Caveat",cursive;font-size:22px;line-height:30px;
  background:linear-gradient(90deg,transparent 40px,rgba(214,64,64,.55) 40px 42px,transparent 42px),repeating-linear-gradient(180deg,transparent 0 29px,rgba(70,120,190,.28) 29px 30px),
  radial-gradient(ellipse at 80% 0%,rgba(150,110,40,.10),transparent 60%),#fbf7ea;background-attachment:local}
.nb-page h2{font:700 34px/1.1 "Caveat",cursive;margin:0 0 6px;color:#1d2b55;transform:rotate(-1deg)}
.nb-h{font:700 24px/30px "Caveat",cursive;margin:14px 0 0;color:#a23a2a;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.nb-notes{margin:0;padding-left:18px}.nb-notes li{margin:0;color:#1d2b55}
.nb-notes .frag{font-family:var(--f-mono);font-size:15px;background:#fff3a8;color:#1d1d1d;padding:0 5px;border-radius:2px;box-shadow:0 1px 0 rgba(0,0,0,.15)}
.nb-docs{display:flex;flex-wrap:wrap;gap:8px 10px;margin-top:6px}
.nb-docs .docitem{font:600 13px/1.3 var(--f-ui);color:#2b2b2b;background:#fff8c8;border:0;border-radius:1px;padding:8px 10px;box-shadow:0 2px 4px rgba(0,0,0,.18);transform:rotate(-1deg);max-width:100%}
.nb-docs .docitem:nth-child(2n){background:#e4f2ff;transform:rotate(.8deg)}.nb-docs .docitem:nth-child(3n){background:#ffe3e3;transform:rotate(-.4deg)}
.nb-docs .docitem:hover,.nb-docs .docitem:focus-visible{transform:translateY(-2px) rotate(0);box-shadow:0 5px 10px rgba(0,0,0,.22)}
.nb-empty{color:#6b6b6b;margin:0}.nb-foot{margin:14px 0 0;font-size:18px;color:#6b6b6b}
.notebook .close{right:10px;top:10px}
@media (max-width:640px){.nb-page{padding:16px 16px 16px 48px;font-size:20px}.nb-rings{width:26px}}
.carnet-h{font-family:var(--f-ui);font-size:16px;margin:14px 0 6px}
.docs{display:flex;flex-direction:column;gap:6px}
.docitem{display:block;text-align:left;font:600 13px var(--f-ui);color:inherit;text-decoration:none;background:color-mix(in srgb,var(--on) 10%,transparent);border:1px solid color-mix(in srgb,var(--on) 30%,transparent);border-radius:4px;padding:6px 10px;cursor:pointer}
.docitem:hover{background:color-mix(in srgb,var(--on) 20%,transparent)}
.roue{position:relative;width:min(100%,480px,62vh);margin:0 auto;line-height:0}
.roue>svg:first-child{width:100%;height:auto;display:block}
.wmark{filter:drop-shadow(0 0 6px rgba(255,140,48,.8))}
.wletter{animation:wIn .35s ease both}
@keyframes wIn{from{opacity:0}to{opacity:1}}
.roue svg.ov{position:absolute;inset:0;width:100%;height:100%}
.backbtn{position:sticky;top:0;float:left;margin:-4px 8px 4px -4px;z-index:3;background:rgba(0,0,0,.55);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:3px 12px;font:600 12px var(--f-ui);cursor:pointer}
.backbtn:hover{background:rgba(0,0,0,.75)}
.sparkcv{position:absolute;z-index:4;margin:-120px 0 0 -160px;pointer-events:none}
.sparkp{position:absolute;z-index:4;width:4px;height:4px;margin:-2px;border-radius:50%;background:#fff6c2;box-shadow:0 0 6px 2px #ffd23a,0 0 12px 3px #ff8a00;pointer-events:none;animation:sparkFly .6s ease-out forwards}
@keyframes sparkFly{0%{transform:translate(0,0);opacity:1}100%{transform:translate(var(--dx),calc(var(--dy) + 18px));opacity:0}}
.sparkflash{position:absolute;z-index:4;width:60px;height:60px;margin:-30px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,230,.95),rgba(255,200,60,.5) 35%,transparent 70%);pointer-events:none;animation:flash .35s ease-out forwards}
@keyframes flash{from{opacity:1;transform:scale(.4)}to{opacity:0;transform:scale(1.4)}}
@media (prefers-reduced-motion:reduce){.sparkp{display:none}}
.rapport{background:#fdfdf8;color:#1b1b1b;width:min(100%,820px);max-height:100%;overflow:auto;padding:22px 26px;border-radius:3px;box-shadow:0 12px 40px rgba(0,0,0,.55);font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:13px;position:relative}
.rapport p{margin:.35em 0}
.rp-head{display:flex;justify-content:space-between;align-items:center;border:1.5px solid #222;padding:6px 10px;margin-right:30px}
.rp-head img{background:#111;border-radius:2px}
.rp-title{text-align:center;font-family:"IBM Plex Sans",sans-serif;font-weight:500;font-size:20px;margin:14px 0 10px}
.rp-box{border:1.5px solid #222;padding:4px 10px;margin:8px 0}
.rp-sec{text-align:center;text-decoration:underline;margin-top:16px!important}
.rp-blue{color:#2a6fb5}.rp-red{color:#d32f2f}
.rp-chart{margin:6px auto;max-width:640px}
.rp-chart .chart{padding:2px;border:1px solid #ddd}
.rp-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:4px;font-family:var(--f-ui)}
.rp-tools .hint{color:#555;opacity:1}
.rp-legend{display:flex;flex-direction:column;gap:2px;margin:4px 0 0 30px}
.rp-legend i{display:inline-block;width:70px;border-top:2px solid #d00;margin-right:10px;vertical-align:middle}
.rp-legend i.l-dash{border-top-style:dashed;border-top-width:3px}
.fq{margin:12px 0 4px}.fq b{font-weight:600}
.fo{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto;grid-auto-flow:column;gap:4px 18px;margin:4px 0 4px 22px}
.f-info{text-align:center;color:#2a6fb5;margin:12px 0!important}
.wpair{display:flex;gap:14px;align-items:stretch;justify-content:center;width:min(100%,1300px);max-height:100%}
.wpair>.rapport{flex:1 1 560px;width:auto;font-size:12.5px}
.wpair>.card{flex:0 1 560px;max-height:100%;overflow:auto;margin:0}
@media (max-width:900px){.wpair{flex-direction:column;justify-content:flex-start;align-items:stretch;overflow:auto}.wpair>.rapport,.wpair>.card{flex:none;max-height:none;overflow:visible}.fo{grid-template-columns:1fr;grid-template-rows:none;grid-auto-flow:row}}
.rp-foot{display:flex;justify-content:space-around;flex-wrap:wrap;gap:6px}
.shutmsg{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);z-index:3;background:rgba(10,14,16,.78);color:#e8f6ea;border:1px solid rgba(120,220,140,.5);padding:.5em 1.1em;border-radius:3px;font-family:"Russo One",var(--f-ui),sans-serif;font-size:clamp(12px,1.6vw,18px);letter-spacing:.04em;white-space:nowrap;animation:pageIn .8s ease both;transition:opacity .5s}
.shutmsg.out{opacity:0}
.smoke{position:absolute;z-index:1;pointer-events:none;object-fit:contain;opacity:.9}
.spot.fresh{animation:freshIn .8s cubic-bezier(.2,.8,.3,1.3) both,freshGlow 2.6s .8s ease-in-out infinite}
.spot.fresh::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid color-mix(in srgb,#fff 70%,var(--acc));opacity:0;animation:freshRing 2.6s .8s ease-out infinite;pointer-events:none}
@keyframes freshIn{from{opacity:0;transform:translate(-50%,-50%) scale(.3)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes freshGlow{0%,100%{box-shadow:0 0 6px 1px color-mix(in srgb,var(--acc) 60%,transparent)}50%{box-shadow:0 0 18px 6px color-mix(in srgb,var(--acc) 75%,transparent)}}
@keyframes freshRing{0%{opacity:.8;transform:scale(.9)}100%{opacity:0;transform:scale(1.7)}}
@media (prefers-reduced-motion:reduce){.spot.fresh,.spot.fresh::after{animation:none}.spot.fresh{box-shadow:0 0 12px 4px color-mix(in srgb,var(--acc) 70%,transparent)}}
.spot.zone,.spot.zone:hover{transform:none;width:auto;aspect-ratio:auto;border:0;border-radius:4px;background:transparent;box-shadow:none;animation:none}
.spot.zone .tip{bottom:auto;top:-28px}
.spot .tip{position:absolute;bottom:115%;left:50%;transform:translateX(-50%);white-space:nowrap;background:rgba(0,0,0,.8);color:var(--paper);font-family:var(--f-ui);font-size:12px;padding:2px 8px;border-radius:4px;opacity:0;pointer-events:none;transition:opacity .15s}
.spot:hover .tip,.spot:focus-visible .tip{opacity:1}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--acc) 70%,transparent)}70%{box-shadow:0 0 0 12px transparent}100%{box-shadow:0 0 0 0 transparent}}
@keyframes glint{0%,85%,100%{background:transparent}90%{background:radial-gradient(circle,rgba(255,255,220,.55),transparent 60%)}}
@media (prefers-reduced-motion:reduce){.spot,.spot.hidden{animation:none}.bg{transition:none}}

/* panneaux plein cadre */
#ui{position:fixed;inset:0;z-index:20;pointer-events:none;container-type:inline-size;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.layer{position:absolute;inset:0;z-index:10;display:flex;padding:max(12px,2.5cqw) max(16px,2.5cqw);overflow:auto;pointer-events:auto}
.layer>*{margin:auto;flex-shrink:0}
/* mise à l'échelle des fenêtres sur grand écran : le calque est mis en page dans un « écran virtuel » plus petit puis agrandi */
.layer{zoom:var(--uiz,1)}
.layer{right:auto!important;bottom:auto!important;left:calc(var(--sl,0px) / var(--uiz,1))!important;top:calc(var(--st,0px) / var(--uiz,1))!important;width:calc(var(--sw,100vw) / var(--uiz,1));height:calc(var(--sh,100vh) / var(--uiz,1))}
#classic{zoom:var(--clz,1)}
.hm-fs{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.82);border:1px solid rgba(255,255,255,.25);border-radius:6px;padding:4px 8px;color:#fff;font:12px var(--f-ui);white-space:nowrap}
.hm-fs span{flex:1}
.hm-fs button{min-width:30px;padding:2px 6px!important;border-radius:4px!important;text-align:center!important}
.cl-fs{font-weight:700}
.layer{padding-top:max(calc(var(--hudb,46px) / var(--uiz,1)),env(safe-area-inset-top,0px) + 40px)!important}
#rot{display:none;font-family:var(--f-ui);color:var(--dim);text-align:center;font-size:13px;margin:10px 16px 0}
/* téléphone tenu verticalement : la scène garde sa hauteur et se parcourt en glissant le doigt */
@media (orientation:portrait) and (max-width:820px){
  body.explore #app{display:block;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scrollbar-width:none}
  body.explore #app::-webkit-scrollbar{display:none}

.dv-dl{text-decoration:none;white-space:nowrap}

        const r=$stage.getBoundingClientRect(),br=b.getBoundingClientRect();const cx=(e&&e.clientX!=null?e.clientX:br.left+br.width/2)-r.left,cy=(e&&e.clientY!=null?e.clientY:br.top+br.height/2)-r.top;

function sparks(x,y){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const W=320,H=320,dpr=Math.min(2,window.devicePixelRatio||1);
  const cv=h('canvas',{class:'sparkcv',width:W*dpr,height:H*dpr,style:{left:x+'px',top:y+'px',width:W+'px',height:H+'px'}});$stage.append(cv);
  const g=cv.getContext('2d');g.scale(dpr,dpr);const cx=W/2,cy=H/2-40;
  const P=[],ARCS=[];let flash=0;
  const burst=(n,pw)=>{flash=pw;for(let i=0;i<n;i++){const a=-Math.PI/2+(Math.random()-.5)*Math.PI*1.7,v=1.5+Math.random()*6.5*pw;
    P.push({x:cx+(Math.random()-.5)*6,y:cy+(Math.random()-.5)*6,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,dec:.018+Math.random()*.035,w:.6+Math.random()*1.4});}
    for(let k=0;k<2+Math.random()*2;k++){const pts=[[cx,cy]];let a=Math.random()*Math.PI*2,len=18+Math.random()*30,px=cx,py=cy;
      for(let s=0;s<6;s++){a+=(Math.random()-.5)*1.4;px+=Math.cos(a)*len/6;py+=Math.sin(a)*len/6;pts.push([px,py]);}ARCS.push({pts,life:1});}};
  const col=l=>l>.7?`rgba(255,255,235,${l})`:l>.4?`rgba(255,${Math.round(150+150*(l-.4))},60,${l})`:`rgba(255,${Math.round(90+150*l)},20,${l*1.3})`;
  burst(46,1);setTimeout(()=>burst(24,.7),140+Math.random()*80);setTimeout(()=>burst(14,.5),380+Math.random()*120);
  const t0=performance.now();
  const step=now=>{g.clearRect(0,0,W,H);g.globalCompositeOperation='lighter';
    if(flash>0){const r=g.createRadialGradient(cx,cy,0,cx,cy,70*flash);r.addColorStop(0,`rgba(220,235,255,${.9*flash})`);r.addColorStop(.3,`rgba(140,180,255,${.35*flash})`);r.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=r;g.fillRect(0,0,W,H);flash*=.72;if(flash<.03)flash=0;}
    for(const a of ARCS){g.strokeStyle=`rgba(200,225,255,${a.life})`;g.shadowColor='#8fb8ff';g.shadowBlur=10;g.lineWidth=1.6*a.life+.4;g.beginPath();a.pts.forEach(([px,py],i)=>{const jx=px+(Math.random()-.5)*3,jy=py+(Math.random()-.5)*3;i?g.lineTo(jx,jy):g.moveTo(jx,jy);});g.stroke();a.life-=.22;}
    g.shadowBlur=0;
    for(const p of P){if(p.life<=0)continue;const ox=p.x,oy=p.y;p.vy+=.22;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.life-=p.dec;
      if(p.life>0&&Math.random()<.004){p.life*=.5;}
      g.strokeStyle=col(Math.max(0,p.life));g.lineWidth=p.w*(.5+p.life);g.lineCap='round';g.beginPath();g.moveTo(ox-p.vx*.8,oy-p.vy*.8);g.lineTo(p.x,p.y);g.stroke();}
    for(let k=ARCS.length-1;k>=0;k--)if(ARCS[k].life<=0)ARCS.splice(k,1);
    if(now-t0<1600)requestAnimationFrame(step);else cv.remove();};
  requestAnimationFrame(step);
}

function focusPic(pic,src,u,v,z=1){
  const im=new Image();im.src=src;
  const fit=()=>{const W=im.naturalWidth,H=im.naturalHeight;if(!W)return;const r={width:pic.clientWidth,height:pic.clientHeight};if(!r.width)return;
    const fu=Math.min(u,100-u)/100,fv=Math.min(v,100-v)/100;const k=Math.max(z*Math.max(r.width/W,r.height/H),r.width/(2*W*Math.max(fu,.05)),r.height/(2*H*Math.max(fv,.05))),w=W*k,hh=H*k;
    const ox=Math.min(0,Math.max(r.width-w,r.width/2-w*u/100)),oy=Math.min(0,Math.max(r.height-hh,r.height/2-hh*v/100));
    pic.style.backgroundSize=`${w}px ${hh}px`;pic.style.backgroundPosition=`${ox}px ${oy}px`;};
  im.onload=fit;if(im.complete)requestAnimationFrame(fit);
  try{new ResizeObserver(fit).observe(pic);}catch(e){addEventListener('resize',fit);}
}

  return l;
}

function tone(f,t0,dur,type='square',vol=.12){const c=ac();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,c.currentTime+t0);g.gain.linearRampToValueAtTime(vol,c.currentTime+t0+.01);g.gain.setValueAtTime(vol,c.currentTime+t0+dur-.03);g.gain.linearRampToValueAtTime(0,c.currentTime+t0+dur);o.connect(g).connect(c.destination);o.start(c.currentTime+t0);o.stop(c.currentTime+t0+dur+.02);}
function synth(kind){if(MUTED)return;const c=ac();if(!c)return;
  if(kind==='robot'){const seq=[[0,880],[.07,1320],[.14,990],[.21,1480],[.30,740]];seq.forEach(([t,f])=>{const o=c.createOscillator(),g=c.createGain();o.type='square';o.frequency.setValueAtTime(f,c.currentTime+t);o.frequency.exponentialRampToValueAtTime(f*(.8+Math.random()*.5),c.currentTime+t+.06);g.gain.setValueAtTime(0,c.currentTime+t);g.gain.linearRampToValueAtTime(.06,c.currentTime+t+.005);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t+.065);o.connect(g).connect(c.destination);o.start(c.currentTime+t);o.stop(c.currentTime+t+.08);});}
  if(kind==='press'){const n=Math.floor(c.sampleRate*.2),b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<n;i++){const t=i/c.sampleRate;const k1=Math.exp(-t*420),t2=t-.075,k2=t2>0?Math.exp(-t2*380)*.75:0;
      d[i]=(Math.random()*2-1)*(k1+k2)*.9+Math.sin(2*Math.PI*150*t)*Math.exp(-t*45)*.6+(t2>0?Math.sin(2*Math.PI*210*t2)*Math.exp(-t2*60)*.35:0);}
    const s=c.createBufferSource(),g=c.createGain(),f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=1400;f.Q.value=.6;
    const lo=c.createGain();lo.gain.value=.5;s.buffer=b;s.connect(f).connect(g);s.connect(lo).connect(g);g.gain.value=.55;g.connect(c.destination);s.start();}
  if(kind==='alarm'){tone(880,0,.16);tone(660,.2,.16);tone(880,.45,.16);tone(660,.65,.16);}
  if(kind==='hiss'){const n=c.sampleRate*1.4,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++){const t=i/c.sampleRate;d[i]=(Math.random()*2-1)*Math.min(1,t*12)*Math.exp(-Math.max(0,t-.5)*3);}
    const s=c.createBufferSource(),g=c.createGain(),f=c.createBiquadFilter();f.type='highpass';f.frequency.value=2500;g.gain.value=.35;s.buffer=b;s.connect(f).connect(g).connect(c.destination);s.start();}
  if(kind==='buzz'){const n=c.sampleRate*.7,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++){const t=i/c.sampleRate;const crackle=Math.random()<.02?1:0;d[i]=(Math.random()*2-1)*(.35+.65*crackle)*(Math.sin(2*Math.PI*50*t)>0?1:.25)*Math.exp(-t*2.2);}
    const s=c.createBufferSource(),g=c.createGain(),f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=1800;f.Q.value=.7;g.gain.value=.5;s.buffer=b;s.connect(f).connect(g).connect(c.destination);s.start();tone(100,0,.5,'sawtooth',.05);}
}

function mkMap(p0,v0,p1,v1,log){if(log){const a=Math.log10(v0),b=Math.log10(v1);return{toV:p=>Math.pow(10,a+(p-p0)*(b-a)/(p1-p0)),toP:v=>p0+(Math.log10(v)-a)*(p1-p0)/(b-a)};}return{toV:p=>v0+(p-p0)*(v1-v0)/(p1-p0),toP:v=>p0+(v-v0)*(p1-p0)/(v1-v0)};}
function svgEl(t,a){const e=document.createElementNS('http://www.w3.org/2000/svg',t);for(const k in a)e.setAttribute(k,a[k]);return e;}
function chartBase(src,W,H,alt){

  const ov=svgEl('svg',{class:'ov',viewBox:`0 0 ${W} ${H}`,preserveAspectRatio:'none'});
  const wrap=h('div',{class:'wrap'},img,ov);
  const ro=h('div',{class:'readout'},'—');
  const root=h('div',{class:'chart'},wrap,ro);
  const toLocal=e=>{const r=ov.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};};
  return{root,ov,ro,toLocal,W,H};
}
const fmtN=(v,d=0)=>v.toLocaleString('fr-FR',{maximumFractionDigits:d,minimumFractionDigits:d});

function curveReader(which){
  const W=1168,H=526,X=mkMap(47.5,0,1138.5,50000),Y=mkMap(485,0,12,300);

  c.ov.append(vl,hl,dot);
  const mv=e=>{const p=c.toLocal(e);let y=snapY(CURVES[which],p.x,p.y);const on=y!=null;if(!on)y=p.y;
    for(const el of [vl,hl,dot])el.setAttribute('visibility','visible');
    vl.setAttribute('x1',p.x);vl.setAttribute('x2',p.x);hl.setAttribute('y1',y);hl.setAttribute('y2',y);dot.setAttribute('cx',p.x);dot.setAttribute('cy',y);dot.setAttribute('fill',on?'#1565c0':'#888');

        h('button',{class:'btn ghost',onclick:()=>{PROF=null;try{sessionStorage.removeItem('retro-prof');}catch(e){}closeAll();renderClassic();}},'Quitter le mode prof')));
    layer(card);return;}
  const mis=(m,t)=>h('button',{class:'pmis pm'+m,onclick:()=>{closeAll();profPrereq(m);briefing(m);}},h('b',null,'Mission '+m),h('span',null,t));
  const card=h('div',{class:'card quiz prof'},h('h2',{class:'stamp'},'Mode prof'),
    h('p',{class:'center hint'},'Choisis la mission à ouvrir. Les missions précédentes sont considérées comme réussies.'),
    h('div',{class:'pmiss'},mis(1,'Accéder à la salle des machines'),mis(2,'Identifier le modèle du processus défaillant'),mis(3,'Étudier le comportement fréquentiel'),mis(4,'Stopper le processus'),
      h('button',{class:'pmis pm5',onclick:()=>{closeAll();profPrereq(4);setMission(5);showEnd();}},h('b',null,'Fin'),h('span',null,'Félicitations et sondage'))),
    h('div',{class:'row',style:{marginTop:'14px'}},
      h('button',{class:'btn',style:{background:'var(--gold)',color:'#1b1405'},onclick:()=>{closeTop();profKey();}},'Voir le corrigé'),
      h('button',{class:'btn ghost',onclick:()=>{S={m:0,scene:null,f:{}};save();closeAll();showTitle();updScore(0);toast('Progression et score effacés');}},'Effacer la progression'),
      h('button',{class:'btn ghost',onclick:resetMode},'Changer de format'),
      h('button',{class:'btn ghost',onclick:()=>{PROF=null;try{sessionStorage.removeItem('retro-prof');}catch(e){}closeAll();showTitle();}},'Quitter le mode prof')));
  layer(card);
}
function profKey(){
  let K=null;try{const b=atob(SECRET.key),k=new TextEncoder().encode(normCode(PROF||'')),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i)^k[i%k.length];K=JSON.parse(new TextDecoder().decode(u));}catch(e){}
  const card=h('div',{class:'card quiz prof'},h('h2',{class:'stamp'},'Corrigé'));
  if(!K)card.append(h('p',null,'Impossible d’afficher le corrigé.'));
  else for(const [m,rows] of K)card.append(h('h4',{class:'pkh'},m),h('div',{style:{overflowX:'auto'}},h('table',{class:'table'},rows.map(([q,a])=>h('tr',null,h('td',null,q),h('td',null,h('b',null,a)))))));
  card.append(nextBtn('Retour au menu prof',()=>{closeTop();profMenu();}));
  layer(card);
}
